<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnveInspect — Agent Fleet Control Plane</title>
<style>
/* ── Design system (elevated dark-ops → enterprise SaaS) ───────────────────
   Approved DNA kept: dark, terminal-adjacent precision, ONE accent per status.
   Elevated: real surfaces/elevation, KPI tiles, charts, multi-view routing.  */
:root{
  --bg:#0a0d12; --surface:#10141b; --surface2:#161c25; --elevated:#1b222d;
  --line:#232b37; --line-soft:#1a212b;
  --txt:#eef2f7; --dim:#8b97a6; --faint:#566172;
  --ok:#3ecf8e; --red:#ff5d55; --amber:#ffb454; --info:#5b9dff;
  --ok-bg:rgba(62,207,142,.10); --red-bg:rgba(255,93,85,.11); --amber-bg:rgba(255,180,84,.11); --info-bg:rgba(91,157,255,.12);
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.6);
}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Söhne","Inter",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"Berkeley Mono","JetBrains Mono",ui-monospace,SFMono-Regular,monospace}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}

.app{display:grid;grid-template-columns:230px 1fr;height:100vh}

/* ── Sidebar ─────────────────────────────────────────────────────────────*/
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 20px 20px;font-family:"Berkeley Mono",ui-monospace,monospace;font-size:13.5px;letter-spacing:.13em}
.brand .dot{width:9px;height:9px;border-radius:99px;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.brand b{color:var(--ok);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--dim);font-size:13.5px;font-weight:450;cursor:pointer;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface2);color:var(--txt)}
.nav a.active{background:var(--elevated);color:var(--txt);font-weight:550}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a .badge{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);background:var(--surface2);padding:1px 7px;border-radius:99px;min-width:22px;text-align:center}
.nav a.alerts .badge.hot{color:var(--red);background:var(--red-bg)}
.railfoot{margin-top:auto;padding:14px 20px 4px;border-top:1px solid var(--line-soft)}
.railfoot .op{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.railfoot .op .k{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.railfoot .m{font-size:11px;color:var(--faint);margin-top:6px}

/* ── Main ────────────────────────────────────────────────────────────────*/
.main{overflow-y:auto;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:10;background:rgba(10,13,18,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:15px 28px}
.topbar h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.topbar .sub{color:var(--dim);font-size:12.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.chip .k{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.btn{font-size:12.5px;color:var(--txt);background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 13px;cursor:pointer;transition:border-color .12s,background .12s;font-weight:500}
.btn:hover{border-color:var(--dim);background:var(--elevated)}
.btn.primary{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.page{padding:24px 28px 60px;max-width:1240px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:26px 0 12px;font-weight:600}
.section-title:first-child{margin-top:0}

/* ── KPI tiles ───────────────────────────────────────────────────────────*/
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:11.5px;color:var(--dim);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.kpi .num{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-family:"Berkeley Mono",ui-monospace,monospace}
.kpi .num.warn{color:var(--amber)} .kpi .num.crit{color:var(--red)}
.kpi .delta{font-size:12px;color:var(--dim);margin-top:5px}
.kpi .delta .up{color:var(--ok)} .kpi .delta .down{color:var(--red)}
.kpi .spark{margin-top:10px;height:26px;display:flex;align-items:flex-end;gap:2px}
.kpi .spark i{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}

/* ── Cards & grid ────────────────────────────────────────────────────────*/
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;padding:15px 18px 0}
.card .hd h3{font-size:13.5px;font-weight:600}
.card .hd .meta{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace}
.card .bd{padding:16px 18px}

/* ── Token trend chart (single hue, baseline-anchored) ───────────────────*/
.chart{height:150px;display:flex;align-items:flex-end;gap:3px;position:relative;padding-top:8px}
.chart .bar{flex:1;background:var(--info);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;transition:opacity .12s;position:relative;cursor:default}
.chart .bar:hover{opacity:1}
.chart .bar[data-empty="1"]{background:var(--line-soft)}
.chart-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace;margin-top:8px}
.tooltip{position:fixed;z-index:50;background:var(--elevated);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:12px;pointer-events:none;box-shadow:0 8px 24px -8px #000;opacity:0;transition:opacity .1s}
.tooltip .t-day{color:var(--faint);font-family:ui-monospace,monospace;font-size:10.5px}
.tooltip .t-val{color:var(--txt);font-weight:600;font-family:ui-monospace,monospace}

/* ── Platform breakdown bars ─────────────────────────────────────────────*/
.pbar{display:flex;align-items:center;gap:11px;padding:7px 0}
.pbar .pv{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);flex:0 0 92px}
.pbar .track{flex:1;height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.pbar .fill{height:100%;background:var(--ok);border-radius:99px}
.pbar .pn{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txt);flex:0 0 42px;text-align:right}

/* ── Tables ──────────────────────────────────────────────────────────────*/
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}thead th.sortable:hover{color:var(--dim)}
thead th .arrow{opacity:.5;font-size:9px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.agent-cell{display:flex;align-items:center;gap:9px}
.agent-cell .nm{font-weight:500}
.vtag{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.mono-c{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
.pill{font-family:ui-monospace,monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 8px;font-weight:500}
.pill.healthy{color:var(--ok);background:var(--ok-bg)} .pill.stale{color:var(--amber);background:var(--amber-bg)} .pill.failed{color:var(--red);background:var(--red-bg)}
.unavail{color:var(--faint);font-style:italic;font-size:12px}

/* ── Filters ─────────────────────────────────────────────────────────────*/
.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 13px;color:var(--txt);font-size:13px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--dim)}
.fchips{display:flex;gap:6px}
.fchip{font-size:12px;color:var(--dim);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;transition:all .12s}
.fchip:hover{color:var(--txt)}
.fchip.on{color:var(--txt);background:var(--elevated);border-color:var(--dim)}

/* ── Attention rows ──────────────────────────────────────────────────────*/
.attn-row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.attn-row:last-child{border-bottom:none}
.attn-row .sev{width:8px;height:8px;border-radius:99px;flex:none;background:var(--red)}
.attn-row .sev.amber{background:var(--amber)}
.attn-row .sevtag{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--red);flex:0 0 42px}
.attn-row .sevtag.amber{color:var(--amber)}
.attn-row .who{font-family:ui-monospace,monospace;font-size:13px;flex:0 0 200px;color:var(--txt)}
.attn-row .why{color:var(--dim);font-size:13px;flex:1}
.ack{font-size:12px;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 13px;background:var(--surface2);cursor:pointer}
.ack:hover{border-color:var(--dim)}

/* ── Connector cards ─────────────────────────────────────────────────────*/
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.conn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.conn .top{display:flex;align-items:center;justify-content:space-between}
.conn .name{font-size:14px;font-weight:600}
.conn .st{font-family:ui-monospace,monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:99px}
.conn .st.ready{color:var(--ok);background:var(--ok-bg)} .conn .st.wait{color:var(--amber);background:var(--amber-bg)} .conn .st.err{color:var(--red);background:var(--red-bg)} .conn .st.off{color:var(--faint);background:var(--surface2)}
.conn .detail{color:var(--dim);font-size:12.5px;margin-top:11px;line-height:1.5}
.conn .fix{margin-top:11px;background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 11px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--info);word-break:break-all}
.conn .count{font-family:"Berkeley Mono",ui-monospace,monospace;font-size:22px;font-weight:600;margin-top:10px}
.conn .count small{font-size:12px;color:var(--faint);font-weight:400;font-family:inherit}

/* ── Lineage ─────────────────────────────────────────────────────────────*/
.lin-root{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lin-root:hover{background:var(--surface2)}
.lin-root .tw{color:var(--faint);font-size:11px;width:12px}
.lin-root .rn{font-size:13px;color:var(--txt)}
.lin-root .rmeta{margin-left:auto;font-size:12px;color:var(--dim);font-family:ui-monospace,monospace}
.lin-tree{padding:6px 18px 14px 30px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.lin-loading{color:var(--faint);font-size:12px;padding:8px}
.tn{position:relative}
.tn-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.tn-dot{width:7px;height:7px;border-radius:99px;flex:none}
.tn-name{font-size:12.5px;color:var(--txt)}
.tn-meta{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace}
.tn-kids{border-left:1px solid var(--line);margin-left:3px;padding-left:6px}
.tn-more{font-size:11px;color:var(--faint);padding:3px 0 3px 18px;font-style:italic}
/* ── Agent detail drawer ─────────────────────────────────────────────────*/
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.drawer-scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 40px -20px #000;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:41;overflow-y:auto}
.drawer.on{transform:none}
.dw-hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between}
.dw-hd .title{font-size:19px;font-weight:600}
.dw-hd .subs{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw-close{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);width:30px;height:30px;cursor:pointer;font-size:15px}
.dw-close:hover{color:var(--txt);border-color:var(--dim)}
.dw-bd{padding:20px 24px}
.dw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.dw-stat{background:var(--surface2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px}
.dw-stat .l{font-size:11px;color:var(--dim)} .dw-stat .v{font-size:19px;font-weight:600;font-family:"Berkeley Mono",ui-monospace,monospace;margin-top:4px}
.dw-sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;font-weight:600}
.dw-cad{background:var(--surface2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--dim)}
.dw-cad .on{color:var(--ok)}
.dw-spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:8px 0 4px}
.dw-spark i{flex:1;background:var(--info);border-radius:2px 2px 0 0;min-height:2px;opacity:.8}
.dw-runs{border:1px solid var(--line-soft);border-radius:var(--radius-sm);overflow:hidden}
.dw-run{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.dw-run:last-child{border-bottom:none}
.dw-run .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dw-run .ts{font-family:ui-monospace,monospace;color:var(--dim);flex:1}
.dw-run .tk{font-family:ui-monospace,monospace;color:var(--faint)}
.act-row{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line-soft);font-size:13px}
.act-row:hover{background:var(--surface2)}
.act-dot{width:8px;height:8px;border-radius:99px;flex:none}
.act-when{color:var(--faint);font-size:11.5px;flex:0 0 66px}
.act-name{color:var(--txt);flex:0 0 210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-trig{color:var(--dim);font-size:12px;flex:0 0 90px}
.act-status{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);flex:0 0 110px}
.act-tok{color:var(--faint);font-size:11.5px;margin-left:auto}
/* ── Empty / loading ─────────────────────────────────────────────────────*/
.empty{text-align:center;color:var(--dim);padding:50px 20px}
.empty .big{font-size:15px;color:var(--txt);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--elevated) 37%,var(--surface2) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.allclear{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--ok);font-size:13.5px}

@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.rail{display:none}}
</style></head>
<body data-palette="#5b9dff">
<div class="app">
  <nav class="rail">
    <div class="brand"><span class="dot"></span>ANVE<b>INSPECT</b></div>
    <div class="nav" id="nav">
      <a data-route="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
      <a data-route="agents"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Agents<span class="badge" id="b-agents">–</span></a>
      <a data-route="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
      <a data-route="lineage"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3M12 13.5v2"/></svg>Lineage<span class="badge" id="b-line">–</span></a>
      <a data-route="attention" class="alerts"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r=".5"/></svg>Attention<span class="badge" id="b-attn">–</span></a>
      <a data-route="connectors"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>Connectors<span class="badge" id="b-conn">–</span></a>
    </div>
    <div class="railfoot">
      <div class="op"><span class="k"></span>Operated by Claude</div>
      <div class="m" id="railmachine">—</div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Overview</h1></div>
      <div class="spacer"></div>
      <span class="chip" id="freshChip"><span class="k"></span><span id="freshText">loading…</span></span>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="tooltip" id="tt"></div>
<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null?null : n>=1e6?(n/1e6).toFixed(1)+'M' : n>=1e3?Math.round(n/1e3)+'k' : String(n);
const rel = iso => { if(!iso) return '—'; const s=(Date.now()-Date.parse(iso))/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago'; if(s<86400)return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; };

let FLEET=null, INSIGHTS=null, LINEAGE=null, ANALYTICS=null;
const state = { agentSearch:'', agentVendor:'all', agentStatus:'all', sortKey:'lastRunAt', sortDir:-1 };

async function load(){
  const [f,i,an] = await Promise.all([
    fetch('/api/fleet').then(r=>r.json()),
    fetch('/api/insights').then(r=>r.json()).catch(()=>null),
    fetch('/api/analytics').then(r=>r.json()).catch(()=>null),
  ]);
  FLEET=f; INSIGHTS=i; ANALYTICS=an;
  const p=f.pulse;
  $('#b-agents').textContent=p.total;
  const attnBadge=$('#b-attn'); attnBadge.textContent=p.openAlerts+p.stale; attnBadge.classList.toggle('hot',p.openAlerts>0);
  $('#b-conn').textContent=(f.connectors||[]).filter(c=>!c.error).length;
  fetch('/api/lineage').then(r=>r.json()).then(l=>{LINEAGE=l;const b=$('#b-line');if(b)b.textContent=l.summary.totalEdges;if(currentRoute()==='lineage')render();}).catch(()=>{});
  $('#freshText').textContent='synced '+rel(f.generatedAt);
  $('#railmachine').textContent=(f.machines[0]?.label||'—')+' · '+p.machines+' machine'+(p.machines===1?'':'s');
  render();
}

const routes=['overview','agents','activity','lineage','attention','connectors'];

function renderAgents(page){
  const vendors=['all',...new Set(FLEET.inventory.map(a=>a.vendor))];
  const filters=el('div','filters');
  const search=el('input','search'); search.placeholder='Search agents, machines, vendors…'; search.value=state.agentSearch;
  search.oninput=()=>{state.agentSearch=search.value;drawAgentTable();};
  filters.appendChild(search);
  const vchips=el('div','fchips');
  vendors.forEach(v=>{const ch=el('div','fchip'+(state.agentVendor===v?' on':''));ch.textContent=v==='all'?'all vendors':v.replace('_',' ');ch.onclick=()=>{state.agentVendor=v;refreshAgents();};vchips.appendChild(ch);});
  filters.appendChild(vchips);
  const schips=el('div','fchips');
  ['all','healthy','stale','failed'].forEach(s=>{const ch=el('div','fchip'+(state.agentStatus===s?' on':''));ch.textContent=s;ch.onclick=()=>{state.agentStatus=s;refreshAgents();};schips.appendChild(ch);});
  filters.appendChild(schips);
  page.appendChild(filters);

  const card=el('div','card'); card.id='agentsCard';
  agentsCardEl=card;
  page.appendChild(card);
  drawAgentTable();
}
let agentsCardEl=null;
function refreshAgents(){ // re-render filters (for chip active state) then table
  const v=$('#view'); v.innerHTML=''; const p=el('div','page'); renderAgents(p); v.appendChild(p);
}
function filteredAgents(){
  let rows=FLEET.inventory.slice();
  const q=state.agentSearch.trim().toLowerCase();
  if(q) rows=rows.filter(a=>(a.name+' '+a.vendor+' '+(a.machine||'')+' '+a.trigger).toLowerCase().includes(q));
  if(state.agentVendor!=='all') rows=rows.filter(a=>a.vendor===state.agentVendor);
  if(state.agentStatus!=='all') rows=rows.filter(a=>a.status===state.agentStatus);
  const k=state.sortKey,dir=state.sortDir;
  rows.sort((a,b)=>{let av=a[k],bv=b[k];
    if(k==='lastRunAt'){av=av?Date.parse(av):0;bv=bv?Date.parse(bv):0;}
    if(k==='tokens30d'){av=av??-1;bv=bv??-1;}
    if(typeof av==='string')return dir*av.localeCompare(bv);
    return dir*((av>bv)-(av<bv));});
  return rows;
}
function drawAgentTable(){
  const card=agentsCardEl; if(!card)return;
  const rows=filteredAgents();
  const cols=[['name','Agent'],['machine','Machine'],['lastRunAt','Last run'],['status','Status'],['trigger','Trigger'],['runCount','Runs'],['tokens30d','Tokens 30d']];
  const arrow=k=>state.sortKey===k?`<span class="arrow">${state.sortDir<0?'▼':'▲'}</span>`:'';
  let html=`<div class="hd"><h3>${rows.length} agent${rows.length===1?'':'s'}</h3><span class="meta">${state.agentVendor==='all'?'all vendors':state.agentVendor} · ${state.agentStatus}</span></div>
    <div class="bd" style="padding:0"><table><thead><tr>`;
  cols.forEach(([k,l])=>html+=`<th class="sortable" data-k="${k}">${l} ${arrow(k)}</th>`);
  html+='</tr></thead><tbody>';
  if(!rows.length){ html+=`<tr><td colspan="7"><div class="empty"><div class="big">No agents match.</div>Try clearing filters.</div></td></tr>`; }
  rows.forEach(a=>{
    html+=`<tr><td class="agent-cell"><span class="nm">${esc(a.name)}</span><span class="vtag">${esc(a.vendor.replace('_',' '))}</span>${a.identitySource==='basename'?'<span class="unavail" title="identity from directory name">◦</span>':''}</td>
      <td class="mono-c">${esc(a.machine||'—')}</td>
      <td class="mono-c">${rel(a.lastRunAt)}</td>
      <td><span class="pill ${a.status}">${a.status}</span></td>
      <td class="mono-c">${esc(a.trigger)}</td>
      <td class="mono-c">${a.runCount}</td>
      <td class="mono-c">${a.tokens30d==null?'<span class="unavail">unavailable</span>':(fmt(a.tokens30d)??'0')}</td></tr>`;
  });
  html+='</tbody></table></div>';
  card.innerHTML=html;
  card.querySelectorAll('tbody tr').forEach((tr,i)=>{ if(rows[i]){ tr.style.cursor='pointer'; tr.onclick=()=>openAgent(rows[i].name); } });
  card.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=k==='name'||k==='trigger'||k==='status'?1:-1;}
    drawAgentTable();
  });
}

function renderLineage(page){
  if(!LINEAGE){ page.appendChild(el('div','empty','Loading lineage…')); fetch('/api/lineage').then(r=>r.json()).then(l=>{LINEAGE=l;render();}); return; }
  const s=LINEAGE.summary;
  const kpis=el('div','kpis');

  kpis.appendChild(kpiTile('Widest fan-out', s.widestFanout?s.widestFanout.children:'—', s.widestFanout?esc(s.widestFanout.agentName):'none'));
  page.appendChild(kpis);

  const st=el('div','section-title'); st.textContent='Spawns by platform'; page.appendChild(st);
  const pcard=el('div','card'); const pbd=el('div','bd');
  const max=Math.max(1,...s.byVendor.map(v=>v.spawns));
  s.byVendor.forEach(v=>{const row=el('div','pbar');row.innerHTML=`<span class="pv">${esc(v.vendor.replace('_',' '))}</span><span class="track"><span class="fill" style="width:${Math.round(v.spawns/max*100)}%"></span></span><span class="pn">${v.spawns}</span>`;pbd.appendChild(row);});
  pcard.appendChild(pbd); page.appendChild(pcard);

  const st2=el('div','section-title'); st2.textContent='Lineage roots — click to expand the spawn tree'; page.appendChild(st2);
  const rcard=el('div','card'); const rbd=el('div'); rbd.style.padding='4px 0';
  LINEAGE.roots.forEach(root=>{
    const row=el('div','lin-root');
    row.innerHTML=`<span class="tw">▸</span><span class="rn mono">${esc(root.agentName)}</span><span class="vtag">${esc(root.vendor.replace('_',' '))}</span>
      <span class="rmeta">${root.directChildren} direct · ${root.descendantCount} descendants</span>`;
    const treeBox=el('div','lin-tree'); treeBox.style.display='none';
    row.onclick=async()=>{
      const open=treeBox.style.display!=='none';
      if(open){treeBox.style.display='none';row.querySelector('.tw').textContent='▸';return;}
      row.querySelector('.tw').textContent='▾'; treeBox.style.display='block';
      if(!treeBox.dataset.loaded){ treeBox.innerHTML='<div class="lin-loading">loading tree…</div>';
        const t=await fetch('/api/lineage/tree?run='+encodeURIComponent(root.runId)).then(r=>r.json()).catch(()=>null);
        treeBox.innerHTML=''; if(t)treeBox.appendChild(treeNode(t,0)); else treeBox.innerHTML='<div class="lin-loading">no tree</div>';
        treeBox.dataset.loaded='1';
      }
    };
    rbd.appendChild(row); rbd.appendChild(treeBox);
  });
  rcard.appendChild(rbd); page.appendChild(rcard);

function treeNode(n,depth){
  const wrap=el('div','tn'); wrap.style.marginLeft=(depth?18:0)+'px';
  const dot={healthy:'var(--ok)',completed:'var(--ok)',error:'var(--red)',unknown_end:'var(--amber)'}[n.status]||'var(--dim)';
  wrap.innerHTML=`<div class="tn-row"><span class="tn-dot" style="background:${dot}"></span>
    <span class="tn-name mono">${esc(n.agentName)}</span><span class="vtag">${esc(n.vendor.replace('_',' '))}</span>
    <span class="tn-meta">${esc(n.trigger)} · ${n.status} · ${n.tokens==null?'unavail':fmt(n.tokens)} tok${n.children.length?` · ${n.descendantCount} desc`:''}</span></div>`;
  if(n.children.length){
    const kids=el('div','tn-kids');
    n.children.slice(0,40).forEach(c=>kids.appendChild(treeNode(c,depth+1)));
    if(n.children.length>40)kids.appendChild(el('div','tn-more','+ '+(n.children.length-40)+' more children'));
    wrap.appendChild(kids);
  }
  return wrap;
}

const VENDOR_LABEL={claude_code:'Claude Code',codex:'Codex',openclaw:'OpenClaw',hermes:'Hermes',bedrock:'Amazon Bedrock',vertex:'Google Vertex',foundry:'Microsoft AI Foundry',cloudflare:'Cloudflare Workers'};
function renderConnectors(page){
  const synced=FLEET.connectors||[];
  const byV=Object.fromEntries(synced.map(c=>[c.vendor,c]));
  const localVendors=['claude_code','codex'];
  const all=['claude_code','codex','openclaw','hermes','vertex','bedrock','foundry','cloudflare'];
  const invByV={}; FLEET.inventory.forEach(a=>invByV[a.vendor]=(invByV[a.vendor]||0)+1);

  const intro=el('div'); intro.style.cssText='color:var(--dim);font-size:13px;margin-bottom:16px;max-width:640px';
  intro.innerHTML=`AnveInspect reuses the platform CLIs you're already signed into — no API keys to paste. Run <span class="mono" style="color:var(--info)">anveinspect doctor</span> to connect everything, or <span class="mono" style="color:var(--info)">/anveinspect:setup</span> from Claude.`;
  page.appendChild(intro);

  const grid=el('div','conn-grid');
  all.forEach(v=>{
    const card=el('div','conn');
    const count=invByV[v]||0;
    const s=byV[v];
    let stClass,stText,detail,fix='';
    if(localVendors.includes(v)){ stClass='ready';stText='local';detail='Reads local logs — no signin needed.'; }
    else if(s && s.error){ stClass='err';stText='error';detail=s.error; }
    else if(s && s.agentCount>=0 && !s.error){ stClass='ready';stText='connected';detail='Synced '+rel(s.syncedAt)+'.'+(s.warnings&&s.warnings.length?' '+s.warnings[0]:''); }
    else { stClass='wait';stText='connect';detail='Not connected yet — reuse your CLI login.';fix=fixFor(v); }
    card.innerHTML=`<div class="top"><span class="name">${VENDOR_LABEL[v]||v}</span><span class="st ${stClass}">${stText}</span></div>
      <div class="count">${count} <small>agent${count===1?'':'s'} in inventory</small></div>
      <div class="detail">${esc(detail)}</div>${fix?`<div class="fix">${esc(fix)}</div>`:''}`;
    grid.appendChild(card);
  });
  page.appendChild(grid);
}
function fixFor(v){return {vertex:'gcloud auth login',bedrock:'aws configure  (or aws sso login)',cloudflare:'anveinspect connectors set cloudflare apiToken <token>',foundry:'az login'}[v]||'anveinspect connectors init';}

async function openAgent(name){

  const d=await fetch('/api/agent?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  if(!d||d.error){ drawer.querySelector('.dw-bd').innerHTML=`<div class="empty">${esc(d?.error||'not found')}</div>`; return; }
  const a=d.agent;
  const runs=d.recentRuns||[];
  const withTok=runs.filter(r=>r.tokens!=null).map(r=>r.tokens);
  const totalTok=withTok.reduce((s,t)=>s+t,0);
  const maxTok=Math.max(1,...withTok);
  const spark=runs.slice(0,24).reverse().map(r=>`<i style="height:${r.tokens==null?2:Math.max(2,Math.round(r.tokens/maxTok*44))}px" title="${r.tokens==null?'unavailable':fmt(r.tokens)+' tok'}"></i>`).join('');
  const dotOf=s=>({completed:'var(--ok)',healthy:'var(--ok)',error:'var(--red)',unknown_end:'var(--amber)'}[s]||'var(--dim)');
  drawer.innerHTML=`
    <div class="dw-hd">
      <div><div class="title">${esc(a.display_name)}</div>
        <div class="subs"><span class="vtag">${esc(a.vendor.replace('_',' '))}</span><span>${esc(a.trigger_source)}</span><span>·</span><span>${a.source==='platform_connector'?'platform connector':'local'}</span></div>
      </div><button class="dw-close">✕</button>
    </div>
    <div class="dw-bd">
      <div class="dw-stats">
        <div class="dw-stat"><div class="l">Recent runs</div><div class="v">${runs.length}</div></div>
        <div class="dw-stat"><div class="l">Subagent spawns</div><div class="v">${d.subagentSpawns}</div></div>
        <div class="dw-stat"><div class="l">Tokens (recent)</div><div class="v">${withTok.length?fmt(totalTok):'—'}</div></div>
      </div>
      <div class="dw-sec">Cadence</div>
      <div class="dw-cad">${d.cadence?`<span class="on">${esc(d.cadence.expect)}</span> · grace ${d.cadence.grace_minutes}m · ${d.cadence.declared?'declared':'inferred'} · set via ${esc(d.cadence.origin)} ${esc((d.cadence.updated_at||'').slice(0,10))}`:'No cadence declared. Ask Claude: "watch '+esc(a.display_name)+', it runs daily at &lt;time&gt;" — or run <span class="mono">anveinspect cadence declare '+esc(a.display_name)+' "daily HH:MM"</span>'}</div>
      <div class="dw-sec">Token trend (recent runs)</div>
      ${withTok.length?`<div class="dw-spark">${spark}</div>`:'<div class="dw-cad">No token data — this agent is catalog-only or its transcripts are unavailable.</div>'}
      <div class="dw-sec">Run history</div>
      <div class="dw-runs">${runs.length?runs.slice(0,20).map(r=>`<div class="dw-run"><span class="dot" style="background:${dotOf(r.status)}"></span><span class="ts">${esc((r.startedAt||'').replace('T',' ').slice(0,19))}</span><span>${esc(r.status)}</span><span class="tk">${r.tokens==null?'unavail':fmt(r.tokens)}</span></div>`).join(''):'<div class="dw-run">no runs recorded</div>'}</div>
    </div>`;
  drawer.querySelector('.dw-close').onclick=closeDrawer;
}

/* ── tooltip ──────────────────────────────────────────────────────────── */
const tt=$('#tt');
function showTip(e,day,val){tt.innerHTML=`<div class="t-day">${esc(day)}</div><div class="t-val">${esc(val)}</div>`;tt.style.opacity='1';tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function hideTip(){tt.style.opacity='0';}

load();
setInterval(load, 60000); // live refresh every minute
</script>
</body></html>

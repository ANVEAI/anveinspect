<!doctype html>
<html><head><meta charset="utf-8"><title>fleetdeck — agent fleet</title>
<style>
/* Approved design: dark ops console (variant A) + fleet-pulse headline (variant B port).
   Tokens from the design doc's Design Specification section. */
:root{
  --bg:#0b0e12; --surface:#11151b; --surface2:#161b23; --line:#232a35;
  --txt:#e8edf4; --dim:#8b96a5; --faint:#525d6b;
  --red:#ff5d55; --amber:#ffb454; --ok:#3ecf8e;
}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.45 "Söhne","Neue Haas Grotesk",-apple-system,sans-serif}
.mono{font-family:"Berkeley Mono","JetBrains Mono",ui-monospace,monospace}
.app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 0}
.brand{padding:0 18px 22px;font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.14em}
.brand b{color:var(--ok)}
.nav a{display:flex;justify-content:space-between;padding:8px 18px;color:var(--dim);text-decoration:none;font-size:13.5px}
.nav a.active{color:var(--txt);background:var(--surface2);border-left:2px solid var(--ok);padding-left:16px}
.nav .n{font-family:ui-monospace,monospace;font-size:12px;color:var(--faint)}
.nav a.alerts .n{color:var(--red)}
.railfoot{margin-top:40px;padding:0 18px;font-size:11.5px;color:var(--faint)}
.main{overflow:auto;padding-bottom:40px}
.pulse{padding:22px 24px 4px}
.pulse h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.pulse h1 .bad{color:var(--red)} .pulse h1 .warn{color:var(--amber)}
.pulse p{color:var(--dim);font-size:13px;margin-top:4px}
.attn{margin:16px 24px 0;border:1px solid #3a2426;background:linear-gradient(180deg,#191113,#14100f);border-radius:8px}
.attn h2{font-size:11px;letter-spacing:.12em;color:var(--red);padding:10px 16px 6px;text-transform:uppercase}
.attn.allclear{border-color:var(--line);background:var(--surface)}
.attn.allclear h2{color:var(--ok)}
.attn-row{display:flex;align-items:center;gap:14px;padding:9px 16px;border-top:1px solid #241a1c}
.attn-row .sev{width:8px;height:8px;border-radius:99px;background:var(--red);flex:none}
.attn-row .sev.amber{background:var(--amber)}
.attn-row .who{font-family:ui-monospace,monospace;font-size:13px;flex:0 0 220px}
.attn-row .why{color:var(--dim);font-size:13px;flex:1}
.ack{font-size:12px;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 12px;background:var(--surface2);cursor:pointer}
.ack:hover{border-color:var(--dim)}
.tablewrap{margin:18px 24px}
h3{font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:9px 14px;border-bottom:1px solid #1a2029;font-size:13px}
tr:last-child td{border-bottom:none}
.agent .v{font-family:ui-monospace,monospace;font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:1px}
td.mono{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--dim)}
.badge{font-family:ui-monospace,monospace;font-size:11px;border-radius:5px;padding:2px 8px}
.b-healthy{color:var(--ok);background:rgba(62,207,142,.08)}
.b-stale{color:var(--amber);background:rgba(255,180,84,.09)}
.b-failed{color:var(--red);background:rgba(255,93,85,.1)}
.unavail{color:var(--faint);font-style:italic;font-size:12px}
.conf{color:var(--faint);font-size:10.5px}
.empty{margin:60px auto;max-width:420px;text-align:center;color:var(--dim)}
.empty code{display:block;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;color:var(--txt)}
</style></head><body>
<div class="app">
  <div class="rail">
    <div class="brand">FLEET<b>DECK</b></div>
    <div class="nav">
      <a class="active" href="#">Agents <span class="n" id="n-agents">–</span></a>
      <a class="alerts" href="#">Attention <span class="n" id="n-attn">–</span></a>
      <a href="#">Machines <span class="n" id="n-machines">–</span></a>
      <a href="#">Connectors <span class="n">0</span></a>
    </div>
    <div class="railfoot" id="foot">loading…</div>
  </div>
  <div class="main">
    <div class="pulse"><h1 id="pulse">…</h1><p id="pulse-sub"></p></div>
    <div class="attn" id="attn" hidden></div>
    <div class="tablewrap"><h3 id="inv-title">Inventory</h3>
      <table id="inv"><thead><tr><th>Agent</th><th>Machine</th><th>Last run</th><th>Status</th><th>Trigger</th><th>Runs</th><th>Tokens 30d</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>
<script>
const rel = (iso) => {
  if (!iso) return '—';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};
const fmt = (n) => n === null ? null : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/fleet').then((r) => r.json()).then((d) => {
  const p = d.pulse;
  document.getElementById('n-agents').textContent = p.total;
  document.getElementById('n-attn').textContent = p.failed + p.stale;
  document.getElementById('n-machines').textContent = p.machines;
  const parts = [`${p.total} agents`];
  if (p.failed) parts.push(`<span class="bad">${p.failed} failed</span>`);
  if (p.stale) parts.push(`<span class="warn">${p.stale} stale</span>`);
  if (!p.failed && !p.stale) parts.push('all on schedule');
  document.getElementById('pulse').innerHTML = parts.join(' · ');
  document.getElementById('pulse-sub').textContent =
    `Across ${p.machines} machine${p.machines === 1 ? '' : 's'} and ${p.platforms} platform${p.platforms === 1 ? '' : 's'} · snapshot ${rel(d.generatedAt)}`;
  document.getElementById('foot').textContent = (d.machines[0]?.label ?? '') + ' · scanned ' + rel(d.machines[0]?.last_heartbeat_at);

  const attn = document.getElementById('attn');
  attn.hidden = false;
  if (d.attention.length === 0) {
    attn.className = 'attn allclear';
    attn.innerHTML = '<h2>All ' + p.total + ' agents on schedule</h2>';
  } else {
    attn.innerHTML = '<h2>Needs attention · ' + d.attention.length + '</h2>' + d.attention.map((a) =>
      `<div class="attn-row"><span class="sev ${a.severity === 'amber' ? 'amber' : ''}"></span><span class="who">${esc(a.who)}</span><span class="why">${esc(a.why)}</span>${a.alertId ? `<button class="ack" data-id="${esc(a.alertId)}">Ack</button>` : ''}</div>`).join('');
    attn.querySelectorAll('.ack').forEach((btn) => btn.addEventListener('click', async () => {
      await fetch('/api/ack/' + encodeURIComponent(btn.dataset.id), { method: 'POST' });
      location.reload();
    }));
  }

  const tb = document.querySelector('#inv tbody');
  document.getElementById('inv-title').textContent =
    `Inventory · ${p.total} agents · ${p.machines} machines · ${p.platforms} platforms`;
  tb.innerHTML = d.inventory.map((i) => `<tr>
    <td class="agent">${esc(i.name)}<span class="v">${esc(i.vendor.replace('_', ' '))}</span>${i.identitySource === 'basename' ? ' <span class="conf" title="identity from directory name — connect a git remote for cross-machine matching">◦ basename id</span>' : ''}</td>
    <td class="mono">${esc(i.machine)}</td>
    <td class="mono">${rel(i.lastRunAt)}</td>
    <td><span class="badge b-${i.status}">${i.status === 'failed' ? 'FAILED' : i.status === 'stale' ? 'STALE' : 'healthy'}</span></td>
    <td class="mono">${esc(i.trigger)}</td>
    <td class="mono">${i.runCount}</td>
    <td class="mono">${i.tokens30d === null ? '<span class="unavail">unavailable</span>' : fmt(i.tokens30d) ?? '0'}</td>
  </tr>`).join('');
  if (d.inventory.length === 0) {
    document.querySelector('.main').insertAdjacentHTML('beforeend',
      '<div class="empty">No agents found on this machine yet.<code>npm run scan</code></div>');
  }
});
</script>
</body></html>

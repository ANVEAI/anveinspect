<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnveInspect — Agent Fleet Control Plane</title>
<style>
/* ── Design system (elevated dark-ops → enterprise SaaS) ───────────────────
   Approved DNA kept: dark, terminal-adjacent precision, ONE accent per status.
   Elevated: real surfaces/elevation, KPI tiles, charts, multi-view routing.  */
:root{
  --bg:#0a0d12; --surface:#10141b; --surface2:#161c25; --elevated:#1b222d;
  --line:#232b37; --line-soft:#1a212b;
  --txt:#eef2f7; --dim:#8b97a6; --faint:#566172;
  --ok:#3ecf8e; --red:#ff5d55; --amber:#ffb454; --info:#5b9dff;
  --ok-bg:rgba(62,207,142,.10); --red-bg:rgba(255,93,85,.11); --amber-bg:rgba(255,180,84,.11); --info-bg:rgba(91,157,255,.12);
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.6);
}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Söhne","Inter",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"Berkeley Mono","JetBrains Mono",ui-monospace,SFMono-Regular,monospace}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}

.app{display:grid;grid-template-columns:230px 1fr;height:100vh}

/* ── Sidebar ─────────────────────────────────────────────────────────────*/
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 20px 20px;font-family:"Berkeley Mono",ui-monospace,monospace;font-size:13.5px;letter-spacing:.13em}
.brand .dot{width:9px;height:9px;border-radius:99px;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.brand b{color:var(--ok);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--dim);font-size:13.5px;font-weight:450;cursor:pointer;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface2);color:var(--txt)}
.nav a.active{background:var(--elevated);color:var(--txt);font-weight:550}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a .badge{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);background:var(--surface2);padding:1px 7px;border-radius:99px;min-width:22px;text-align:center}
.nav a.alerts .badge.hot{color:var(--red);background:var(--red-bg)}
.railfoot{margin-top:auto;padding:14px 20px 4px;border-top:1px solid var(--line-soft)}
.railfoot .op{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.railfoot .op .k{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.railfoot .m{font-size:11px;color:var(--faint);margin-top:6px}

/* ── Main ────────────────────────────────────────────────────────────────*/
.main{overflow-y:auto;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:10;background:rgba(10,13,18,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:15px 28px}
.topbar h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.topbar .sub{color:var(--dim);font-size:12.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.chip .k{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.btn{font-size:12.5px;color:var(--txt);background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 13px;cursor:pointer;transition:border-color .12s,background .12s;font-weight:500}
.btn:hover{border-color:var(--dim);background:var(--elevated)}
.btn.primary{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.page{padding:24px 28px 60px;max-width:1240px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:26px 0 12px;font-weight:600}
.section-title:first-child{margin-top:0}

/* ── KPI tiles ───────────────────────────────────────────────────────────*/
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:11.5px;color:var(--dim);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.kpi .num{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-family:"Berkeley Mono",ui-monospace,monospace}
.kpi .num.warn{color:var(--amber)} .kpi .num.crit{color:var(--red)}
.kpi .delta{font-size:12px;color:var(--dim);margin-top:5px}
.kpi .delta .up{color:var(--ok)} .kpi .delta .down{color:var(--red)}
.kpi .spark{margin-top:10px;height:26px;display:flex;align-items:flex-end;gap:2px}
.kpi .spark i{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}

/* ── Cards & grid ────────────────────────────────────────────────────────*/
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;padding:15px 18px 0}
.card .hd h3{font-size:13.5px;font-weight:600}
.card .hd .meta{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace}
.card .bd{padding:16px 18px}

/* ── Token trend chart (single hue, baseline-anchored) ───────────────────*/
.chart{height:150px;display:flex;align-items:flex-end;gap:3px;position:relative;padding-top:8px}
.chart .bar{flex:1;background:var(--info);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;transition:opacity .12s;position:relative;cursor:default}
.chart .bar:hover{opacity:1}
.chart .bar[data-empty="1"]{background:var(--line-soft)}
.chart-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace;margin-top:8px}
.tooltip{position:fixed;z-index:50;background:var(--elevated);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:12px;pointer-events:none;box-shadow:0 8px 24px -8px #000;opacity:0;transition:opacity .1s}
.tooltip .t-day{color:var(--faint);font-family:ui-monospace,monospace;font-size:10.5px}
.tooltip .t-val{color:var(--txt);font-weight:600;font-family:ui-monospace,monospace}

/* ── Platform breakdown bars ─────────────────────────────────────────────*/
.pbar{display:flex;align-items:center;gap:11px;padding:7px 0}
.pbar .pv{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);flex:0 0 92px}
.pbar .track{flex:1;height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.pbar .fill{height:100%;background:var(--ok);border-radius:99px}
.pbar .pn{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txt);flex:0 0 42px;text-align:right}

/* ── Tables ──────────────────────────────────────────────────────────────*/
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}thead th.sortable:hover{color:var(--dim)}
thead th .arrow{opacity:.5;font-size:9px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.agent-cell{display:flex;align-items:center;gap:9px}
.agent-cell .nm{font-weight:500}
.vtag{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.mono-c{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
.pill{font-family:ui-monospace,monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 8px;font-weight:500}
.pill.healthy{color:var(--ok);background:var(--ok-bg)} .pill.stale{color:var(--amber);background:var(--amber-bg)} .pill.failed{color:var(--red);background:var(--red-bg)}
.unavail{color:var(--faint);font-style:italic;font-size:12px}

/* ── Filters ─────────────────────────────────────────────────────────────*/
.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 13px;color:var(--txt);font-size:13px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--dim)}
.fchips{display:flex;gap:6px}
.fchip{font-size:12px;color:var(--dim);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;transition:all .12s}
.fchip:hover{color:var(--txt)}
.fchip.on{color:var(--txt);background:var(--elevated);border-color:var(--dim)}

/* ── Attention rows ──────────────────────────────────────────────────────*/
.attn-row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.attn-row:last-child{border-bottom:none}
.attn-row .sev{width:8px;height:8px;border-radius:99px;flex:none;background:var(--red)}
.attn-row .sev.amber{background:var(--amber)}
.attn-row .sevtag{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--red);flex:0 0 42px}
.attn-row .sevtag.amber{color:var(--amber)}
.attn-row .who{font-family:ui-monospace,monospace;font-size:13px;flex:0 0 200px;color:var(--txt)}
.attn-row .why{color:var(--dim);font-size:13px;flex:1}
.ack{font-size:12px;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 13px;background:var(--surface2);cursor:pointer}
.ack:hover{border-color:var(--dim)}

/* ── Connector cards ─────────────────────────────────────────────────────*/
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.conn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.conn .top{display:flex;align-items:center;justify-content:space-between}
.conn .name{font-size:14px;font-weight:600}
.conn .st{font-family:ui-monospace,monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:99px}
.conn .st.ready{color:var(--ok);background:var(--ok-bg)} .conn .st.wait{color:var(--amber);background:var(--amber-bg)} .conn .st.err{color:var(--red);background:var(--red-bg)} .conn .st.off{color:var(--faint);background:var(--surface2)}
.conn .detail{color:var(--dim);font-size:12.5px;margin-top:11px;line-height:1.5}
.conn .fix{margin-top:11px;background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 11px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--info);word-break:break-all}
.conn .count{font-family:"Berkeley Mono",ui-monospace,monospace;font-size:22px;font-weight:600;margin-top:10px}
.conn .count small{font-size:12px;color:var(--faint);font-weight:400;font-family:inherit}

/* ── Lineage ─────────────────────────────────────────────────────────────*/
.lin-root{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lin-root:hover{background:var(--surface2)}
.lin-root .tw{color:var(--faint);font-size:11px;width:12px}
.lin-root .rn{font-size:13px;color:var(--txt)}
.lin-root .rmeta{margin-left:auto;font-size:12px;color:var(--dim);font-family:ui-monospace,monospace}
.lin-tree{padding:6px 18px 14px 30px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.lin-loading{color:var(--faint);font-size:12px;padding:8px}
.tn{position:relative}
.tn-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.tn-dot{width:7px;height:7px;border-radius:99px;flex:none}
.tn-name{font-size:12.5px;color:var(--txt)}
.tn-meta{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace}
.tn-kids{border-left:1px solid var(--line);margin-left:3px;padding-left:6px}
.tn-more{font-size:11px;color:var(--faint);padding:3px 0 3px 18px;font-style:italic}
/* ── Agent detail drawer ─────────────────────────────────────────────────*/
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.drawer-scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 40px -20px #000;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:41;overflow-y:auto}
.drawer.on{transform:none}
.dw-hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between}
.dw-hd .title{font-size:19px;font-weight:600}
.dw-hd .subs{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw-close{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);width:30px;height:30px;cursor:pointer;font-size:15px}
.dw-close:hover{color:var(--txt);border-color:var(--dim)}
.dw-bd{padding:20px 24px}
.dw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.dw-stat{background:var(--surface2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px}
.dw-stat .l{font-size:11px;color:var(--dim)} .dw-stat .v{font-size:19px;font-weight:600;font-family:"Berkeley Mono",ui-monospace,monospace;margin-top:4px}
.dw-sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;font-weight:600}
.dw-cad{background:var(--surface2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--dim)}
.dw-cad .on{color:var(--ok)}
.dw-spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:8px 0 4px}
.dw-spark i{flex:1;background:var(--info);border-radius:2px 2px 0 0;min-height:2px;opacity:.8}
.dw-runs{border:1px solid var(--line-soft);border-radius:var(--radius-sm);overflow:hidden}
.dw-run{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.dw-run:last-child{border-bottom:none}
.dw-run .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dw-run .ts{font-family:ui-monospace,monospace;color:var(--dim);flex:1}
.dw-run .tk{font-family:ui-monospace,monospace;color:var(--faint)}
.act-row{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line-soft);font-size:13px}
.act-row:hover{background:var(--surface2)}
.act-dot{width:8px;height:8px;border-radius:99px;flex:none}
.act-when{color:var(--faint);font-size:11.5px;flex:0 0 66px}
.act-name{color:var(--txt);flex:0 0 210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-trig{color:var(--dim);font-size:12px;flex:0 0 90px}
.act-status{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);flex:0 0 110px}
.act-tok{color:var(--faint);font-size:11.5px;margin-left:auto}
/* ── Tags ────────────────────────────────────────────────────────────────*/
.dw-tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tag-chip{display:inline-flex;align-items:center;gap:5px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--info);background:var(--info-bg);border-radius:99px;padding:3px 9px}
.tag-x{cursor:pointer;color:var(--dim);font-size:13px;line-height:1}.tag-x:hover{color:var(--red)}
.tag-add{font-size:11.5px;color:var(--dim);border:1px dashed var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
.tag-add:hover{color:var(--txt);border-color:var(--dim)}
.tag-input{background:var(--surface2);border:1px solid var(--dim);border-radius:99px;padding:3px 10px;color:var(--txt);font-size:11.5px;font-family:ui-monospace,monospace;width:100px}
.tag-input:focus{outline:none}
.row-tags{display:inline-flex;gap:4px;margin-left:8px}
.row-tag{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--info);background:var(--info-bg);border-radius:4px;padding:1px 5px}
/* ── Empty / loading ─────────────────────────────────────────────────────*/
.empty{text-align:center;color:var(--dim);padding:50px 20px}
.empty .big{font-size:15px;color:var(--txt);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--elevated) 37%,var(--surface2) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.allclear{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--ok);font-size:13.5px}
.graph-canvas{width:100%;height:470px;display:block;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line-soft);cursor:grab;user-select:none}
.graph-canvas.focused{border-color:var(--info)}
.graph-crumbs{display:none;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.gcrumb{background:var(--surface2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:3px 11px;font:inherit;font-size:11.5px;cursor:pointer}
.gcrumb:hover{border-color:var(--info);color:var(--txt)}
.gsep{color:var(--faint);font-size:11px}
.gcur{color:var(--txt);font-size:11.5px;font-weight:600;padding:3px 4px}
.dw-rels{border:1px solid var(--line-soft);border-radius:var(--radius-sm);overflow:hidden}
.dw-rel{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px}
.dw-rel:last-child{border-bottom:none}
.dw-rel:hover{background:var(--surface2)}
.dw-rel .dir{color:var(--faint);font-family:ui-monospace,monospace;font-size:10px;white-space:nowrap}
.dw-rel .rn{color:var(--txt);font-weight:500}
.dw-rel .rm{margin-left:auto;color:var(--dim);font-family:ui-monospace,monospace;font-size:10.5px;white-space:nowrap}
.dw-chips{display:flex;flex-wrap:wrap;gap:6px}
.dw-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--dim)}
.dw-chip b{color:var(--txt);font-family:ui-monospace,monospace;font-size:10.5px;font-weight:500}
.dw-chip.mcp{border-color:rgba(91,157,255,.4);color:var(--info)}
.dw-tree{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px 12px;max-height:280px;overflow:auto}
.graph-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.graph-legend .gl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.graph-legend .gl i{width:9px;height:9px;border-radius:99px;display:inline-block}
.graph-legend .gl-hint{margin-left:auto;font-size:11px;color:var(--faint)}
.gantt-sel{background:var(--surface2);color:var(--text);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;max-width:420px}
.gantt{padding:4px 0}
.gantt-axis{display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);padding:0 0 8px 172px}
.gantt-row{display:flex;align-items:center;gap:10px;padding:2.5px 0}
.gantt-label{width:162px;flex:none;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.gantt-label.root{color:var(--ok);font-weight:600}
.gantt-track{flex:1;position:relative;height:13px;background:var(--bg);border-radius:3px}
.gantt-bar{position:absolute;top:1.5px;height:10px;background:var(--info);border-radius:2.5px;opacity:.9;min-width:3px;cursor:default}
.gantt-bar.root{background:var(--ok)}
.gantt-bar.err{background:var(--red)}
.gantt-bar.open{border-right:2px dashed rgba(232,237,244,.6)}
.welcome .bd{padding:34px 38px}

</style></head>
<body data-palette="#5b9dff">
<div class="app">
  <nav class="rail">
    <div class="brand"><span class="dot"></span>THOUGHT<b>SHIELDAI</b></div>
    <div class="brand-tag">Every agent. One control plane.</div>
    <div class="nav" id="nav">
      <a data-route="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
      <a data-route="agents"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Agents<span class="badge" id="b-agents">–</span></a>
      <a data-route="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
      <a data-route="lineage"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3M12 13.5v2"/></svg>Lineage<span class="badge" id="b-line">–</span></a>
      <a data-route="attention" class="alerts"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r=".5"/></svg>Attention<span class="badge" id="b-attn">–</span></a>
      <a data-route="connectors"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>Connectors<span class="badge" id="b-conn">–</span></a>
    </div>
    <div class="railfoot">
      <div class="op"><span class="k"></span>Operated by Claude</div>
      <div class="m" id="railmachine">—</div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Overview</h1></div>
      <div class="spacer"></div>
      <span class="chip" id="freshChip"><span class="k"></span><span id="freshText">loading…</span></span>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="tooltip" id="tt"></div>
<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null?null : n>=1e6?(n/1e6).toFixed(1)+'M' : n>=1e3?Math.round(n/1e3)+'k' : String(n);
const rel = iso => { if(!iso) return '—'; const s=(Date.now()-Date.parse(iso))/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago'; if(s<86400)return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; };

let FLEET=null, INSIGHTS=null, LINEAGE=null, ANALYTICS=null, GRAPH=null;
const state = { agentSearch:'', agentVendor:'all', agentStatus:'all', sortKey:'lastRunAt', sortDir:-1 };

async function load(){
  const [f,i,an] = await Promise.all([
    fetch('/api/fleet').then(r=>r.json()),
    fetch('/api/insights').then(r=>r.json()).catch(()=>null),
    fetch('/api/analytics').then(r=>r.json()).catch(()=>null),
  ]);
  FLEET=f; INSIGHTS=i; ANALYTICS=an;
  const p=f.pulse;
  $('#b-agents').textContent=p.total;
  const attnBadge=$('#b-attn'); attnBadge.textContent=p.openAlerts+p.stale; attnBadge.classList.toggle('hot',p.openAlerts>0);
  $('#b-conn').textContent=(f.connectors||[]).filter(c=>!c.error).length;
  fetch('/api/lineage').then(r=>r.json()).then(l=>{LINEAGE=l;const b=$('#b-line');if(b)b.textContent=l.summary.totalEdges;if(currentRoute()==='lineage')render();}).catch(()=>{});
  $('#freshText').textContent='synced '+rel(f.generatedAt);
  $('#railmachine').textContent=(f.machines[0]?.label||'—')+' · '+p.machines+' machine'+(p.machines===1?'':'s');
  render();
}

const routes=['overview','agents','activity','lineage','attention','connectors'];
const titles={overview:'Overview',agents:'Agents',activity:'Activity',lineage:'Lineage',attention:'Attention',connectors:'Connectors'};
function currentRoute(){const h=location.hash.replace('#','');return routes.includes(h)?h:'overview';}
function go(r){location.hash=r;}
window.addEventListener('hashchange',()=>{graphFocus.length=0;redrawGraph=null;render();});

function setActive(){
  const r=currentRoute();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===r));
  $('#pageTitle').textContent=titles[r];
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.route));
$('#refreshBtn').onclick=()=>{$('#refreshBtn').textContent='…';load().then(()=>$('#refreshBtn').textContent='Refresh');};

function render(){
  if(!FLEET) return;
  setActive();
  const r=currentRoute();
  const v=$('#view'); v.innerHTML='';
  const page=el('div','page');
  ({overview:renderOverview,agents:renderAgents,activity:renderActivity,lineage:renderLineage,attention:renderAttention,connectors:renderConnectors}[r])(page);
  v.appendChild(page);
}

/* ── OVERVIEW ─────────────────────────────────────────────────────────── */
function renderOverview(page){
  const p=FLEET.pulse;
  // first-run: nothing scanned yet — welcome the user with the 30-second path in
  if(p.total===0){
    const hero=el('div','card welcome');
    hero.innerHTML=`<div class="bd">
      <h2>See every AI agent you run</h2>
      <p>AnveInspect reads the logs your agents already write — no instrumentation, no API keys. Three commands to a full fleet:</p>
      <ol>
        <li><span class="mono">anveinspect doctor</span> — detect platforms, reuse your CLI logins, first scan</li>
        <li><span class="mono">anveinspect setup claude</span> — let Claude operate the fleet (Codex/Cursor too)</li>
        <li>Refresh this page — inventory, lineage, costs, and silent-failure paging appear</li>
      </ol></div>`;
    page.appendChild(hero);
    return;
  }
  const totalTok = INSIGHTS ? INSIGHTS.dailyTokens.reduce((s,d)=>s+d.tokens,0) : null;
  const wow = INSIGHTS?.weekOverWeek;
  // KPI row
  const kpis=el('div','kpis');
  kpis.appendChild(kpiTile('Total agents', p.total, `${p.platforms} platforms · ${p.machines} machine${p.machines===1?'':'s'}`));
  kpis.appendChild(kpiTile('Open alerts', p.openAlerts, p.openAlerts?'needs attention':'all clear', p.openAlerts?'crit':''));
  kpis.appendChild(kpiTile('Stale agents', p.stale, p.stale?'quiet >7 days':'none', p.stale?'warn':''));
  const cost=ANALYTICS?ANALYTICS.estimatedCostUsd:null;
  kpis.appendChild(kpiTile('Est. cost · 30d', cost==null?'—':fmtUsd(cost),
    ANALYTICS?`${ANALYTICS.ratesSource} rates · ${ANALYTICS.unpricedRuns} runs unrated · ${ANALYTICS.tokenlessRuns} without tokens`:'estimated'));
  page.appendChild(kpis);

  // Trend + platform breakdown
  const st=el('div','section-title'); st.textContent='Fleet activity'; page.appendChild(st);
  const grid=el('div','grid2');
  grid.appendChild(trendCard());
  grid.appendChild(platformCard());
  page.appendChild(grid);

  // What's running / why running — runs grouped by how they were triggered
  if(ANALYTICS && ANALYTICS.whyRunning && ANALYTICS.whyRunning.length){
    const sw=el('div','section-title'); sw.textContent='Why running · 30d (runs by trigger)'; page.appendChild(sw);
    page.appendChild(whyRunningCard());
  }

  // Cost breakdown
  if(ANALYTICS && ANALYTICS.pricedRuns>0){
    const st3=el('div','section-title'); st3.textContent='Estimated cost · 30d (token counts are exact; dollars are estimates)'; page.appendChild(st3);
    const cg=el('div','grid2');
    cg.appendChild(costByModelCard());
    cg.appendChild(topCostAgentsCard());
    page.appendChild(cg);
    if(ANALYTICS.busiestHours){ const sh=el('div','section-title'); sh.textContent='Activity by hour of day'; page.appendChild(sh); page.appendChild(busiestHoursCard()); }
  }

  // Top agents
  const st2=el('div','section-title'); st2.textContent='Highest token consumers · 30d'; page.appendChild(st2);
  page.appendChild(topAgentsCard());
}
function costByModelCard(){
  const c=el('div','card'); c.innerHTML=`<div class="hd"><h3>Cost by model</h3><span class="meta">${ANALYTICS.ratesSource} rates</span></div>`;
  const bd=el('div','bd'); const max=Math.max(0.0001,...ANALYTICS.costByModel.map(m=>m.usd));
  ANALYTICS.costByModel.forEach(m=>{const row=el('div','pbar');row.innerHTML=`<span class="pv" title="${esc(m.model)}">${esc(m.model.replace('claude-','').replace(/-\d+$/,''))}</span><span class="track"><span class="fill" style="width:${Math.round(m.usd/max*100)}%"></span></span><span class="pn">${fmtUsd(m.usd)}</span>`;bd.appendChild(row);});
  c.appendChild(bd); return c;
}
function topCostAgentsCard(){
  const c=el('div','card'); c.innerHTML=`<div class="hd"><h3>Most expensive agents</h3></div>`;
  const bd=el('div','bd'); bd.style.padding='0'; const t=el('table');
  t.innerHTML='<thead><tr><th>Agent</th><th>Runs</th><th>Est. cost</th></tr></thead>';
  const tb=el('tbody');
  ANALYTICS.topCostAgents.slice(0,8).forEach(a=>{const tr=el('tr');tr.style.cursor='pointer';tr.onclick=()=>openAgent(a.name,a.fingerprint);tr.innerHTML=`<td class="agent-cell"><span class="nm">${esc(a.name)}</span><span class="vtag">${esc(a.vendor.replace('_',' '))}</span></td><td class="mono-c">${a.runs}</td><td class="mono-c">${fmtUsd(a.usd)}</td>`;tb.appendChild(tr);});
  t.appendChild(tb); bd.appendChild(t); c.appendChild(bd); return c;
}
function busiestHoursCard(){
  const c=el('div','card'); c.innerHTML=`<div class="hd"><h3>Runs by hour (local)</h3><span class="meta">last 30 days</span></div>`;
  const bd=el('div','bd'); const chart=el('div','chart'); const max=Math.max(1,...ANALYTICS.busiestHours.map(h=>h.runs));
  ANALYTICS.busiestHours.forEach(h=>{const bar=el('div','bar');bar.style.height=Math.max(2,Math.round(h.runs/max*130))+'px';if(h.runs===0)bar.dataset.empty='1';bar.addEventListener('mousemove',e=>showTip(e,String(h.hour).padStart(2,'0')+':00',h.runs+' runs'));bar.addEventListener('mouseleave',hideTip);chart.appendChild(bar);});
  bd.appendChild(chart); const ax=el('div','chart-axis'); ax.innerHTML='<span>00:00</span><span>12:00</span><span>23:00</span>'; bd.appendChild(ax); c.appendChild(bd); return c;
}
const fmtUsd=n=>n==null?'—':n>=1000?'$'+(n/1000).toFixed(1)+'k':n>=1?'$'+n.toFixed(2):'$'+n.toFixed(3);

function kpiTile(label,num,delta,cls=''){
  const t=el('div','kpi');
  t.innerHTML=`<div class="label">${esc(label)}</div><div class="num ${cls}">${num}</div><div class="delta">${delta}</div>`;
  return t;
}

function trendCard(){
  const c=el('div','card');
  const days=INSIGHTS?.dailyTokens||[];
  const max=Math.max(1,...days.map(d=>d.tokens));
  const last14=days.slice(-14);
  c.innerHTML=`<div class="hd"><h3>Token usage</h3><span class="meta">last 14 days</span></div>`;
  const bd=el('div','bd');
  const chart=el('div','chart');
  last14.forEach(d=>{
    const h=Math.max(2,Math.round((d.tokens/max)*130));
    const bar=el('div','bar'); bar.style.height=h+'px';
    if(d.tokens===0)bar.dataset.empty='1';
    bar.addEventListener('mousemove',e=>showTip(e,`${d.day}`,`${fmt(d.tokens)||0} tokens · ${d.runs} runs`));
    bar.addEventListener('mouseleave',hideTip);
    chart.appendChild(bar);
  });
  bd.appendChild(chart);
  const axis=el('div','chart-axis');
  axis.innerHTML=`<span>${last14[0]?.day.slice(5)||''}</span><span>${last14[last14.length-1]?.day.slice(5)||''}</span>`;
  bd.appendChild(axis);
  c.appendChild(bd);
  return c;
}

const TRIGGER_LABEL={interactive:'Interactive (a human drove it)',subagent:'Spawned by another agent',scheduled:'Scheduled / cadence',hook:'Hook-triggered',unknown:'Unclassified'};
function whyRunningCard(){
  const c=el('div','card');
  c.innerHTML=`<div class="hd"><h3>Runs by trigger</h3><span class="meta">last 30 days</span></div>`;
  const bd=el('div','bd');
  const rows=ANALYTICS.whyRunning; const max=Math.max(1,...rows.map(r=>r.runs));
  rows.forEach(r=>{
    const row=el('div','pbar');
    row.innerHTML=`<span class="pv" title="${esc(TRIGGER_LABEL[r.trigger]||r.trigger)}">${esc(TRIGGER_LABEL[r.trigger]||r.trigger)}</span><span class="track"><span class="fill" style="width:${Math.round(r.runs/max*100)}%"></span></span><span class="pn">${r.runs}</span>`;
    bd.appendChild(row);
  });
  c.appendChild(bd); return c;
}
function platformCard(){
  const c=el('div','card');
  c.innerHTML=`<div class="hd"><h3>Agents by platform</h3></div>`;
  const bd=el('div','bd');
  const byV={};
  FLEET.inventory.forEach(a=>byV[a.vendor]=(byV[a.vendor]||0)+1);
  const entries=Object.entries(byV).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...entries.map(e=>e[1]));
  entries.forEach(([v,n])=>{
    const row=el('div','pbar');
    row.innerHTML=`<span class="pv">${esc(v.replace('_',' '))}</span><span class="track"><span class="fill" style="width:${Math.round(n/max*100)}%"></span></span><span class="pn">${n}</span>`;
    bd.appendChild(row);
  });
  c.appendChild(bd);
  return c;
}

function topAgentsCard(){
  const c=el('div','card');
  const top=(INSIGHTS?.topAgents||[]).slice(0,8);
  const bd=el('div','bd'); bd.style.padding='0';
  if(!top.length){ bd.innerHTML='<div class="empty">No token data yet.</div>'; c.appendChild(bd); return c; }
  const t=el('table');
  t.innerHTML=`<thead><tr><th>Agent</th><th>Trigger</th><th>Runs</th><th>Tokens</th><th>Share</th><th>Unclean-end</th></tr></thead>`;
  const tb=el('tbody');
  top.forEach(a=>{
    const tr=el('tr'); tr.style.cursor='pointer'; tr.onclick=()=>openAgent(a.name,a.fingerprint);
    tr.innerHTML=`<td class="agent-cell"><span class="nm">${esc(a.name)}</span></td>
      <td class="mono-c">${esc(a.trigger)}</td><td class="mono-c">${a.runs30d}</td>
      <td class="mono-c">${a.tokens30d==null?'<span class="unavail">unavail</span>':fmt(a.tokens30d)}</td>
      <td class="mono-c">${a.share==null?'—':Math.round(a.share*100)+'%'}</td>
      <td class="mono-c">${Math.round(a.failureRate*100)}%</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); bd.appendChild(t); c.appendChild(bd);
  return c;
}

/* ── AGENTS ───────────────────────────────────────────────────────────── */
function renderAgents(page){
  const vendors=['all',...new Set(FLEET.inventory.map(a=>a.vendor))];
  const filters=el('div','filters');
  const search=el('input','search'); search.placeholder='Search agents, machines, vendors…'; search.value=state.agentSearch;
  search.oninput=()=>{state.agentSearch=search.value;drawAgentTable();};
  filters.appendChild(search);
  const vchips=el('div','fchips');
  vendors.forEach(v=>{const ch=el('div','fchip'+(state.agentVendor===v?' on':''));ch.textContent=v==='all'?'all vendors':v.replace('_',' ');ch.onclick=()=>{state.agentVendor=v;refreshAgents();};vchips.appendChild(ch);});
  filters.appendChild(vchips);
  const schips=el('div','fchips');
  ['all','healthy','stale','failed'].forEach(s=>{const ch=el('div','fchip'+(state.agentStatus===s?' on':''));ch.textContent=s;ch.onclick=()=>{state.agentStatus=s;refreshAgents();};schips.appendChild(ch);});
  filters.appendChild(schips);
  page.appendChild(filters);

  const card=el('div','card'); card.id='agentsCard';
  agentsCardEl=card;
  page.appendChild(card);
  drawAgentTable();
}
let agentsCardEl=null;
function refreshAgents(){ // re-render filters (for chip active state) then table
  const v=$('#view'); v.innerHTML=''; const p=el('div','page'); renderAgents(p); v.appendChild(p);
}
function filteredAgents(){
  let rows=FLEET.inventory.slice();
  const q=state.agentSearch.trim().toLowerCase();
  if(q) rows=rows.filter(a=>(a.name+' '+a.vendor+' '+(a.machine||'')+' '+a.trigger).toLowerCase().includes(q));
  if(state.agentVendor!=='all') rows=rows.filter(a=>a.vendor===state.agentVendor);
  if(state.agentStatus!=='all') rows=rows.filter(a=>a.status===state.agentStatus);
  const k=state.sortKey,dir=state.sortDir;
  rows.sort((a,b)=>{let av=a[k],bv=b[k];
    if(k==='lastRunAt'){av=av?Date.parse(av):0;bv=bv?Date.parse(bv):0;}
    if(k==='tokens30d'){av=av??-1;bv=bv??-1;}
    if(typeof av==='string')return dir*av.localeCompare(bv);
    return dir*((av>bv)-(av<bv));});
  return rows;
}
function drawAgentTable(){
  const card=agentsCardEl; if(!card)return;
  const rows=filteredAgents();
  const cols=[['name','Agent'],['machine','Machine'],['lastRunAt','Last run'],['status','Status'],['trigger','Trigger'],['runCount','Runs'],['tokens30d','Tokens 30d']];
  const arrow=k=>state.sortKey===k?`<span class="arrow">${state.sortDir<0?'▼':'▲'}</span>`:'';
  let html=`<div class="hd"><h3>${rows.length} agent${rows.length===1?'':'s'}</h3><span class="meta">${state.agentVendor==='all'?'all vendors':state.agentVendor} · ${state.agentStatus}</span></div>
    <div class="bd" style="padding:0"><table><thead><tr>`;
  cols.forEach(([k,l])=>html+=`<th class="sortable" data-k="${k}">${l} ${arrow(k)}</th>`);
  html+='</tr></thead><tbody>';
  if(!rows.length){ html+=`<tr><td colspan="7"><div class="empty"><div class="big">No agents match.</div>Try clearing filters.</div></td></tr>`; }
  rows.forEach(a=>{
    html+=`<tr><td class="agent-cell"><span class="nm">${esc(a.name)}</span><span class="vtag">${esc(a.vendor.replace('_',' '))}</span>${(a.tags||[]).length?`<span class="row-tags">${a.tags.map(t=>`<span class="row-tag">#${esc(t)}</span>`).join('')}</span>`:''}</td>
      <td class="mono-c">${esc(a.machine||'—')}</td>
      <td class="mono-c">${rel(a.lastRunAt)}</td>
      <td><span class="pill ${a.status}">${a.status}</span></td>
      <td class="mono-c">${esc(a.trigger)}</td>
      <td class="mono-c">${a.runCount}</td>
      <td class="mono-c">${a.tokens30d==null?'<span class="unavail">unavailable</span>':(fmt(a.tokens30d)??'0')}</td></tr>`;
  });
  html+='</tbody></table></div>';
  card.innerHTML=html;
  card.querySelectorAll('tbody tr').forEach((tr,i)=>{ if(rows[i]){ tr.style.cursor='pointer'; tr.onclick=()=>openAgent(rows[i].name,rows[i].fingerprint); } });
  card.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=k==='name'||k==='trigger'||k==='status'?1:-1;}
    drawAgentTable();
  });
}

/* ── ACTIVITY ─────────────────────────────────────────────────────────── */
let ACTIVITY=null;
function renderActivity(page){
  const intro=el('div'); intro.style.cssText='color:var(--dim);font-size:13px;margin-bottom:14px';
  intro.textContent='Live feed of the most recent runs across every platform — what ran, when, and how it ended.';
  page.appendChild(intro);
  const card=el('div','card'); const bd=el('div'); bd.id='activityFeed'; bd.style.padding='4px 0';
  bd.innerHTML='<div class="empty">loading activity…</div>'; card.appendChild(bd); page.appendChild(card);
  fetch('/api/activity').then(r=>r.json()).then(d=>{ACTIVITY=d;drawActivity();}).catch(()=>{bd.innerHTML='<div class="empty">no activity</div>';});
}
function drawActivity(){
  const bd=document.getElementById('activityFeed'); if(!bd||!ACTIVITY)return;
  const dotOf=s=>({completed:'var(--ok)',healthy:'var(--ok)',error:'var(--red)',unknown_end:'var(--amber)',running:'var(--info)'}[s]||'var(--dim)');
  if(!ACTIVITY.runs.length){bd.innerHTML='<div class="empty">No runs recorded yet.</div>';return;}
  bd.innerHTML=ACTIVITY.runs.map(r=>`<div class="act-row" data-name="${esc(r.agentName)}" data-fp="${esc(r.fingerprint||'')}">
    <span class="act-dot" style="background:${dotOf(r.status)}"></span>
    <span class="act-when mono">${rel(r.startedAt)}</span>
    <span class="act-name">${esc(r.agentName)}</span><span class="vtag">${esc(r.vendor.replace('_',' '))}</span>
    <span class="act-trig">${esc(r.trigger)}</span>
    <span class="act-status">${esc(r.status)}</span>
    <span class="act-tok mono">${r.tokens==null?'':fmt(r.tokens)+' tok'}</span></div>`).join('');
  bd.querySelectorAll('.act-row').forEach(row=>{row.style.cursor='pointer';row.onclick=()=>openAgent(row.dataset.name,row.dataset.fp);});
}
/* ── LINEAGE ──────────────────────────────────────────────────────────── */
function renderLineage(page){
  if(!LINEAGE||!GRAPH){
    page.appendChild(el('div','empty','Loading lineage…'));
    Promise.all([fetch('/api/lineage').then(r=>r.json()),fetch('/api/graph').then(r=>r.json())])
      .then(([l,g])=>{LINEAGE=l;GRAPH=g;render();});
    return;
  }
  const s=LINEAGE.summary;
  const sub=LINEAGE.subagents||{total:0,active:0,idle:0,stale:0};

  pcard.appendChild(pbd); page.appendChild(pcard);

  LINEAGE.roots.forEach(root=>{
    const row=el('div','lin-root');
    row.innerHTML=`<span class="tw">▸</span><span class="rn mono">${esc(root.agentName)}</span><span class="vtag">${esc(root.vendor.replace('_',' '))}</span>

function treeNode(n,depth){
  const wrap=el('div','tn'); wrap.style.marginLeft=(depth?18:0)+'px';
  const dot={healthy:'var(--ok)',completed:'var(--ok)',error:'var(--red)',unknown_end:'var(--amber)'}[n.status]||'var(--dim)';
  wrap.innerHTML=`<div class="tn-row"><span class="tn-dot" style="background:${dot}"></span>
    <span class="tn-name mono">${esc(n.agentName)}</span><span class="vtag">${esc(n.vendor.replace('_',' '))}</span>
    <span class="tn-meta">${esc(n.trigger)} · ${n.status} · ${n.tokens==null?'unavail':fmt(n.tokens)} tok${n.children.length?` · ${n.descendantCount} desc`:''}</span></div>`;
  if(n.children.length){
    const kids=el('div','tn-kids');
    n.children.slice(0,40).forEach(c=>kids.appendChild(treeNode(c,depth+1)));
    if(n.children.length>40)kids.appendChild(el('div','tn-more','+ '+(n.children.length-40)+' more children'));
    wrap.appendChild(kids);
  }
  return wrap;
}

/* ── AGENT RELATIONSHIP GRAPH (canvas force layout, zero deps) ─────────── */
const GRAPH_COLORS={claude_code:'#3ecf8e',codex:'#5b9dff',openclaw:'#ffb454',hermes:'#c792ea',bedrock:'#ff9d76',vertex:'#7ee0d2',foundry:'#8fa8ff',cloudflare:'#f6821f'};

/* Focus state lives at module level on purpose. load() runs every 60s and calls
   render(), which wipes #view — so anything kept inside initGraph's closure is
   destroyed twice a minute and would eject the user mid-read. Keyed by
   fingerprint, never by array index: indices are invalidated on every rebuild.
   graphPos also survives, which incidentally stops the layout re-scrambling
   from the circle seed on every refresh. */
const graphFocus=[];            // [] = full graph; else a drill path of fingerprints
const graphPos={};              // fingerprint -> {x,y}
const MAX_FOCUS_NEIGHBOURS=12;  // beyond this the ring can't be labelled legibly
let redrawGraph=null;           // set by initGraph so the drawer can drive focus

function focusAgent(fp){
  if(!GRAPH||!GRAPH.nodes.some(n=>n.fingerprint===fp))return;
  const at=graphFocus.indexOf(fp);
  if(at>=0) graphFocus.length=at+1;        // re-entering an ancestor truncates, never cycles
  else if(graphFocus[graphFocus.length-1]!==fp) graphFocus.push(fp);
  if(graphFocus.length>6) graphFocus.splice(0,graphFocus.length-6);
  if(redrawGraph) redrawGraph();
  else if(currentRoute()==='lineage') render();
}
function clearFocus(){ graphFocus.length=0; if(redrawGraph)redrawGraph(); }

/* The visible set when focused: the hub, its parents, its children, and every
   edge among that set — so sibling links show, not just the star. */
function focusSet(fp){
  const keep=new Set([fp]);
  const rel=GRAPH.edges.filter(e=>e.source===fp||e.target===fp)
    .sort((a,b)=>b.spawns-a.spawns).slice(0,MAX_FOCUS_NEIGHBOURS);
  rel.forEach(e=>keep.add(e.source===fp?e.target:e.source));
  const hidden=GRAPH.edges.filter(e=>e.source===fp||e.target===fp).length-rel.length;
  return {keep, hidden};
}

function agentGraphCard(){
  const c=el('div','card');
  const hd=el('div','hd'); hd.innerHTML=`<h3>Relationship graph</h3><span class="meta" id="graphMeta"></span>`;
  c.appendChild(hd);
  const bd=el('div','bd');
  const crumbs=el('div','graph-crumbs'); crumbs.id='graphCrumbs'; bd.appendChild(crumbs);
  const legend=el('div','graph-legend'); legend.id='graphLegend'; bd.appendChild(legend);
  const canvas=document.createElement('canvas'); canvas.className='graph-canvas'; bd.appendChild(canvas);
  c.appendChild(bd);
  requestAnimationFrame(()=>initGraph(canvas)); // wait for layout so clientWidth is real
  return c;
}
function initGraph(canvas){
  const W=canvas.clientWidth||900, H=470;
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const maxRuns=Math.max(1,...GRAPH.nodes.map(n=>n.runs));
  const RING=Math.max(120,Math.min(190,Math.min(W,H)*.33));
  let N=[], E=[], idx={}, selfLoops={}, hubIdx=null, hiddenNeighbours=0;
  let alpha=1, drag=null, hover=null, down=null, lastClick=null;

  /* Rebuildable so double-click can re-filter without render() tearing the whole
     view down. Drops any focus fingerprint that no longer exists in the data,
     otherwise N[undefined] would crash tick(). */
  function build(){
    while(graphFocus.length && !GRAPH.nodes.some(n=>n.fingerprint===graphFocus[graphFocus.length-1])) graphFocus.pop();
    const hub=graphFocus[graphFocus.length-1]||null;
    let keep=null; hiddenNeighbours=0;
    if(hub){ const f=focusSet(hub); keep=f.keep; hiddenNeighbours=f.hidden; }
    const nodes=keep?GRAPH.nodes.filter(n=>keep.has(n.fingerprint)):GRAPH.nodes;

    // Role-biased seeding: parents to the left arc, children to the right, so the
    // arrow direction is readable before reading a single label.
    const kidsOf=new Set(hub?GRAPH.edges.filter(e=>e.source===hub).map(e=>e.target):[]);
    let ai=0;
    N=nodes.map((n,i)=>{
      const cached=graphPos[n.fingerprint];
      let x,y;
      if(hub&&n.fingerprint===hub){ x=W/2; y=H/2; }
      else if(cached&&!hub){ x=cached.x; y=cached.y; }
      else if(hub){
        const total=Math.max(1,nodes.length-1);
        const span=kidsOf.has(n.fingerprint)?[-1.4,1.4]:[1.75,4.53];
        const t=total===1?.5:(ai++)/(total-1);
        const a=span[0]+(span[1]-span[0])*t;
        // ±6px jitter is required, not cosmetic: two exactly-coincident nodes
        // produce a zero unit vector and can never push each other apart.
        x=W/2+Math.cos(a)*RING+(Math.random()-.5)*12;
        y=H/2+Math.sin(a)*RING+(Math.random()-.5)*12;
      } else {
        x=W/2+Math.cos(i/nodes.length*2*Math.PI)*Math.min(W,H)*.33;
        y=H/2+Math.sin(i/nodes.length*2*Math.PI)*Math.min(W,H)*.33;
      }
      return {...n,x,y,vx:0,vy:0,r:7+Math.round(14*Math.sqrt(n.runs/maxRuns))};
    });
    idx={}; N.forEach((n,i)=>idx[n.fingerprint]=i);
    hubIdx=hub!=null&&idx[hub]!=null?idx[hub]:null;
    selfLoops={};
    E=GRAPH.edges.map(e=>({s:idx[e.source],t:idx[e.target],spawns:e.spawns,tokens:e.tokens,dataDown:e.dataDown,dataUp:e.dataUp,w:1+Math.min(4.5,Math.log2(e.spawns+1)*.9)}))
      .filter(e=>{
        if(e.s==null||e.t==null)return false;
        if(e.s===e.t){selfLoops[e.s]=(selfLoops[e.s]||0)+e.spawns;return false;}
        return true;
      });
    // every index-keyed local is now stale
    drag=null; down=null; hover=null; lastClick=null; hideTip();
    alpha=Math.max(alpha,hub?.75:.35);
    paintChrome();
  }
  function tick(){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){ // O(n²) repulsion — edges are capped, this stays small
      const a=N[i],b=N[j]; let dx=a.x-b.x,dy=a.y-b.y; const d2=dx*dx+dy*dy||1; const d=Math.sqrt(d2);
      const rep=Math.min(9,7800/d2); dx/=d; dy/=d; // strong short-range push so labels don't collide
      a.vx+=dx*rep; a.vy+=dy*rep; b.vx-=dx*rep; b.vy-=dy*rep;
    }
    for(const e of E){ // springs pull connected agents to a rest distance
      const a=N[e.s],b=N[e.t]; let dx=b.x-a.x,dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-(120+a.r+b.r))*.012; dx/=d; dy/=d;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
    }
    // The drawer covers the right ~560px, so when focused shift the ring centre
    // left to keep the neighbourhood visible beside it rather than under it.
    const occl=drawer.classList.contains('on')?Math.max(0,canvas.getBoundingClientRect().right-(window.innerWidth-560)):0;
    const cx=hubIdx!==null?Math.max(RING+40,W/2-occl/2):W/2;
    for(const n of N){ // gravity + damping + bounds
      if(hubIdx!==null){
        // ring gravity: centre-pull collapses 5 nodes into a knot, since the
        // repulsion term is short-range and effectively gone past ~100px.
        const dx=n.x-cx, dy=n.y-H/2, d=Math.hypot(dx,dy)||1;
        const k=(RING-d)*.010;
        n.vx+=dx/d*k; n.vy+=dy/d*k;
      } else { n.vx+=(W/2-n.x)*.004; n.vy+=(H/2-n.y)*.004; }
      n.vx*=.85; n.vy*=.85;
      n.x=Math.max(n.r+6,Math.min(W-n.r-6,n.x+n.vx*alpha));
      n.y=Math.max(n.r+6,Math.min(H-n.r-24,n.y+n.vy*alpha));
    }
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){ // hard separation so labels never sit on a neighbor
      const a=N[i],b=N[j]; let dx=b.x-a.x,dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
      const min=a.r+b.r+30;
      if(d<min){const push=(min-d)/2; dx/=d; dy/=d; a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push;}
      // label declutter: labels sit below nodes — if two baselines nearly align, force horizontal room
      const by=(b.y+b.r)-(a.y+a.r);
      if(Math.abs(by)<17){
        const gap=b.x-a.x, need=118;
        if(Math.abs(gap)<need){const push=(need-Math.abs(gap))*.18, s=gap>=0?1:-1; a.x-=s*push; b.x+=s*push;}
      }
    }
    // Pin the hub last — the separation pass above would otherwise shove it
    // off-centre and the hub-and-spoke reading would be lost.
    if(hubIdx!==null&&drag!==hubIdx){
      const occl=drawer.classList.contains('on')?Math.max(0,canvas.getBoundingClientRect().right-(window.innerWidth-560)):0;
      const h=N[hubIdx]; h.x=Math.max(RING+40,W/2-occl/2); h.y=H/2; h.vx=0; h.vy=0;
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const e of E){
      const a=N[e.s],b=N[e.t];
      const hi=hover!==null&&(hover===e.s||hover===e.t);
      let dx=b.x-a.x,dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1; dx/=d; dy/=d;
      const x1=a.x+dx*a.r,y1=a.y+dy*a.r,x2=b.x-dx*(b.r+8),y2=b.y-dy*(b.r+8);
      ctx.strokeStyle=hi?'rgba(91,157,255,.9)':'rgba(140,160,190,.26)';
      ctx.lineWidth=e.w;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.fillStyle=ctx.strokeStyle; // arrowhead: direction = who spawned whom
      ctx.beginPath(); ctx.moveTo(x2+dx*8,y2+dy*8); ctx.lineTo(x2-dy*4,y2+dx*4); ctx.lineTo(x2+dy*4,y2-dx*4); ctx.closePath(); ctx.fill();
      // when focused there are few enough edges to always label, and the count
      // is the payload rather than decoration
      if(e.spawns>=5||hi||hubIdx!==null){
        ctx.fillStyle=hi?'rgba(232,237,244,.95)':'rgba(154,167,184,.7)';
        ctx.font='10px ui-monospace,monospace';
        const vol=hi&&e.dataDown!=null?`  ${fmt(e.dataDown)}ch↓ ${fmt(e.dataUp)}ch↑`:'';
        ctx.fillText(e.spawns+'×'+vol,(x1+x2)/2+5,(y1+y2)/2-5);
      }
    }
    N.forEach((n,i)=>{
      const col=GRAPH_COLORS[n.vendor]||'#9aa7b8';
      const isHub=i===hubIdx;
      if(isHub){ // soft halo so the focused agent reads as the anchor
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+6,0,6.2832);
        ctx.strokeStyle=col+'44'; ctx.lineWidth=2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832);
      ctx.fillStyle=col+(isHub?'55':hover===i?'40':'22'); ctx.fill();
      ctx.lineWidth=isHub?3:hover===i?2.4:1.5; ctx.strokeStyle=col; ctx.stroke();
      if(selfLoops[i]){ // "spawns its own kind" loop arc at the node's top-right
        ctx.beginPath(); ctx.arc(n.x+n.r*.85,n.y-n.r*.85,5.5,-.6,4.2);
        ctx.lineWidth=1.4; ctx.strokeStyle=col; ctx.stroke();
        ctx.fillStyle='rgba(154,167,184,.85)'; ctx.font='9px ui-monospace,monospace';
        ctx.fillText(selfLoops[i]+'×',n.x+n.r*.85+8,n.y-n.r*.85-3);
      }
      ctx.fillStyle=hover===i?'#e8edf4':'#9aa7b8';
      ctx.font=(hover===i?'600 ':'')+'11px ui-monospace,monospace';
      ctx.textAlign='center';
      const label=n.name.length>18?n.name.slice(0,17)+'…':n.name;
      ctx.fillText(label,n.x,n.y+n.r+13);
      ctx.textAlign='left';
    });
  }
  /* Header, breadcrumbs and legend all describe the *current* node set, so they
     are repainted on every build rather than written once at card creation. */
  function paintChrome(){
    const hub=hubIdx!==null?N[hubIdx]:null;
    const meta=document.getElementById('graphMeta');
    if(meta) meta.textContent = hub
      ? `focused on ${hub.name} · ${E.length} relationship${E.length===1?'':'s'} · ${GRAPH.nodes.length-N.length} agents hidden${hiddenNeighbours?` · ${hiddenNeighbours} more neighbours not shown`:''}${GRAPH.truncated?' · graph capped, may be incomplete':''}`
      : `${GRAPH.nodes.length} agents · ${GRAPH.edges.length} relationships${GRAPH.truncated?' · heaviest shown':''} · node size = run volume · arrow = spawns`;
    canvas.classList.toggle('focused',!!hub);

    const cr=document.getElementById('graphCrumbs');
    if(cr){
      cr.style.display=graphFocus.length?'flex':'none';
      if(graphFocus.length){
        const nm={}; GRAPH.nodes.forEach(n=>nm[n.fingerprint]=n.name);
        cr.innerHTML=`<button class="gcrumb" data-i="-1">← All agents</button>`+
          graphFocus.map((fp,i)=>`<span class="gsep">›</span>${i===graphFocus.length-1
            ?`<span class="gcur">${esc(nm[fp]||fp.slice(0,10))}</span>`
            :`<button class="gcrumb" data-i="${i}">${esc(nm[fp]||fp.slice(0,10))}</button>`}`).join('');
        cr.querySelectorAll('.gcrumb').forEach(b=>b.onclick=()=>{
          const i=+b.dataset.i;
          if(i<0) graphFocus.length=0; else graphFocus.length=i+1;
          build();
        });
      }
    }
    const lg=document.getElementById('graphLegend');
    if(lg){
      lg.innerHTML='';
      [...new Set(N.map(n=>n.vendor))].forEach(v=>{
        const s=el('span','gl'); s.innerHTML=`<i style="background:${GRAPH_COLORS[v]||'#9aa7b8'}"></i>${esc(VENDOR_LABEL[v]||v)}`; lg.appendChild(s);
      });
      const hint=el('span','gl-hint');
      hint.textContent=hubIdx!==null?'double-click a neighbour to drill in · drag to arrange':'drag to arrange · click for details · double-click to focus';
      lg.appendChild(hint);
    }
  }

  redrawGraph=build;   // let the drawer drive focus
  build();

  (function loop(){
    if(!canvas.isConnected){ redrawGraph=null; return; } // view navigated away — stop the sim, free the frame
    if(alpha>.02||drag!==null){tick(); alpha*=.996;}
    draw();
    for(const n of N) graphPos[n.fingerprint]={x:n.x,y:n.y}; // survive the 60s rebuild
    requestAnimationFrame(loop);
  })();
  const pos=ev=>{const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};
  const at=p=>{for(let i=N.length-1;i>=0;i--){const n=N[i],dx=p.x-n.x,dy=p.y-n.y;if(dx*dx+dy*dy<=(n.r+5)*(n.r+5))return i;}return null;};
  canvas.onmousedown=ev=>{if(ev.button!==0)return;const p=pos(ev);const i=at(p);if(i!==null){drag=i;down=p;canvas.style.cursor='grabbing';}};
  canvas.onmousemove=ev=>{
    const p=pos(ev);
    if(drag!==null){N[drag].x=p.x;N[drag].y=p.y;N[drag].vx=0;N[drag].vy=0;alpha=Math.max(alpha,.3);hideTip();return;}
    const i=at(p); hover=i; canvas.style.cursor=i!==null?'pointer':'grab';
    if(i!==null){const n=N[i];showTip(ev,n.name,`${n.status?n.status+' · ':''}${VENDOR_LABEL[n.vendor]||n.vendor} · ${fmt(n.runs)} runs · spawned others ${fmt(n.spawnsOut)}× · was spawned ${fmt(n.spawnsIn)}×`);}
    else hideTip();
  };
  canvas.onmouseup=ev=>{
    if(ev.button!==0)return;
    canvas.style.cursor='grab';
    if(drag===null)return;
    const p=pos(ev), moved=down?Math.hypot(p.x-down.x,p.y-down.y):99;
    const i=drag; drag=null; down=null;
    if(moved<4){
      lastClick={i,t:performance.now()};   // dblclick below verifies same node
      openAgent(N[i].name,N[i].fingerprint); // a click, not a drag → open the detail drawer
    }
  };
  /* Native dblclick rather than a delay timer on single click: the first click
     already opens the drawer, which the focused view wants open anyway, so the
     fix belongs in openAgent's de-dupe, not in taxing the primary interaction.
     There is one canvas element, so the browser will fire dblclick even for two
     clicks on *different* bubbles — hence the same-node check. */
  canvas.ondblclick=ev=>{
    if(ev.button!==0)return;
    ev.preventDefault();
    const j=at(pos(ev));
    if(j===null||!lastClick||lastClick.i!==j||performance.now()-lastClick.t>900)return;
    const fp=N[j].fingerprint;
    lastClick=null;
    focusAgent(fp);
  };
  canvas.onmouseleave=()=>{hover=null;drag=null;down=null;hideTip();canvas.style.cursor='grab';};
}

/* ── RELATIONSHIPS TABLE — how each agent pair shares data ─────────────── */
const STATUS_PILL={active:'healthy',idle:'stale',stale:'failed'};
function relationshipsTable(){
  const nm=Object.fromEntries(GRAPH.nodes.map(n=>[n.fingerprint,n]));
  const c=el('div','card');
  c.innerHTML=`<div class="hd"><h3>Data flow per relationship</h3><span class="meta">↓ = parent → subagent payload · ↑ = subagent → parent result · tokens = subagent consumption</span></div>`;
  const bd=el('div','bd'); bd.style.padding='0';
  const t=el('table');
  t.innerHTML='<thead><tr><th>Relationship</th><th>Spawns</th><th>Tokens</th><th>Data ↓</th><th>Data ↑</th><th>Subagent status</th><th>Last active</th></tr></thead>';
  const tb=el('tbody');
  [...GRAPH.edges].sort((a,b)=>b.spawns-a.spawns).slice(0,15).forEach(e=>{
    const p=nm[e.source],ch=nm[e.target]; if(!p||!ch)return;
    const tr=el('tr'); tr.style.cursor='pointer'; tr.onclick=()=>openAgent(ch.name,ch.fingerprint);
    tr.innerHTML=`<td class="agent-cell"><span class="nm">${esc(p.name)} <span style="color:var(--faint)">→</span> ${esc(ch.name)}</span></td>
      <td class="mono-c">${e.spawns}</td>
      <td class="mono-c">${e.tokens==null?'unavail':fmt(e.tokens)}</td>
      <td class="mono-c">${e.dataDown==null?'—':fmt(e.dataDown)+' ch'}</td>
      <td class="mono-c">${e.dataUp==null?'—':fmt(e.dataUp)+' ch'}</td>
      <td><span class="pill ${STATUS_PILL[ch.status]||'stale'}">${esc(ch.status)}</span></td>
      <td class="mono-c">${e.lastSpawnAt?esc(e.lastSpawnAt.slice(0,10)):'—'}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); bd.appendChild(t); c.appendChild(bd); return c;
}

/* ── EXECUTION TIMELINE — when the main agent vs each subagent was active ─ */
function timelineCard(){
  const c=el('div','card');
  const hd=el('div','hd');
  hd.innerHTML=`<h3>Activity windows</h3>`;
  const sel=document.createElement('select'); sel.className='gantt-sel';
  LINEAGE.roots.slice(0,12).forEach((r,i)=>{
    const o=document.createElement('option'); o.value=r.runId;
    o.textContent=`${r.agentName} · ${r.startedAt?r.startedAt.slice(0,16).replace('T',' '):'?'} · ${r.descendantCount} subagents`;
    sel.appendChild(o);
  });
  hd.appendChild(sel); c.appendChild(hd);
  const bd=el('div','bd'); c.appendChild(bd);
  const draw=async runId=>{
    bd.innerHTML='<div class="lin-loading">loading timeline…</div>';
    const t=await fetch('/api/timeline?run='+encodeURIComponent(runId)).then(r=>r.json()).catch(()=>null);
    bd.innerHTML='';
    if(!t||!t.rows||!t.rows.length){bd.innerHTML='<div class="lin-loading">no timeline data</div>';return;}
    bd.appendChild(ganttBody(t.rows));
  };
  sel.onchange=()=>draw(sel.value);
  draw(LINEAGE.roots[0].runId);
  return c;
}
function ganttBody(rows){
  const wrap=el('div','gantt');
  // time domain: min start .. max end (open-ended runs extend to the max end seen)
  const starts=rows.map(r=>r.startedAt?Date.parse(r.startedAt):NaN).filter(n=>!isNaN(n));
  const ends=rows.map(r=>Date.parse(r.endedAt??r.startedAt??'')).filter(n=>!isNaN(n));
  const t0=Math.min(...starts), t1=Math.max(...ends, t0+60000);
  const span=Math.max(1,t1-t0);
  const fmtT=ms=>new Date(ms).toTimeString().slice(0,8);
  const axis=el('div','gantt-axis');
  axis.innerHTML=`<span>${fmtT(t0)}</span><span>${fmtT(t0+span/2)}</span><span>${fmtT(t1)}</span>`;
  wrap.appendChild(axis);
  rows.slice(0,40).forEach(r=>{
    const row=el('div','gantt-row');
    const label=el('div','gantt-label'+(r.isRoot?' root':''));
    label.textContent=(r.isRoot?'▶ ':'')+r.agentName; label.title=r.agentName;
    const track=el('div','gantt-track');
    const s=r.startedAt?Date.parse(r.startedAt):t0;
    const e=r.endedAt?Date.parse(r.endedAt):s+60000; // open-ended: draw a minimum-width bar
    const bar=el('div','gantt-bar'+(r.isRoot?' root':'')+(r.status==='error'?' err':'')+(r.endedAt?'':' open'));
    bar.style.left=((s-t0)/span*100)+'%';
    bar.style.width=Math.max(.6,(e-s)/span*100)+'%';
    bar.addEventListener('mousemove',ev=>showTip(ev,r.agentName,
      `${fmtT(s)} → ${r.endedAt?fmtT(e):'open'} · ${r.tokens==null?'tokens unavail':fmt(r.tokens)+' tok'}`+
      (r.promptChars!=null?` · ↓${fmt(r.promptChars)} ch`:'')+(r.resultChars!=null?` · ↑${fmt(r.resultChars)} ch`:'')));
    bar.addEventListener('mouseleave',hideTip);
    track.appendChild(bar); row.appendChild(label); row.appendChild(track); wrap.appendChild(row);
  });
  if(rows.length>40)wrap.appendChild(el('div','tn-more','+ '+(rows.length-40)+' more subagent runs'));
  return wrap;
}

/* ── ATTENTION ────────────────────────────────────────────────────────── */
function renderAttention(page){
  const items=FLEET.attention;
  const card=el('div','card');
  if(!items.length){
    card.innerHTML=`<div class="allclear">✓ All ${FLEET.pulse.total} agents on schedule — nothing needs attention.</div>`;
    page.appendChild(card); return;
  }
  card.innerHTML=`<div class="hd"><h3>Needs attention</h3><span class="meta">${items.length} item${items.length===1?'':'s'}</span></div>`;
  const bd=el('div'); bd.style.padding='4px 0';
  items.forEach(a=>{
    const amber=a.severity==='amber';
    const row=el('div','attn-row');
    row.innerHTML=`<span class="sev ${amber?'amber':''}"></span><span class="sevtag ${amber?'amber':''}">${amber?'stale':'alert'}</span>
      <span class="who">${esc(a.who)}</span><span class="why">${esc(a.why)}</span>
      ${a.alertId?`<button class="ack" data-id="${esc(a.alertId)}">Ack</button>`:''}`;
    bd.appendChild(row);
  });
  card.appendChild(bd); page.appendChild(card);
  card.querySelectorAll('.ack').forEach(b=>b.onclick=async()=>{
    b.textContent='…'; await fetch('/api/ack/'+encodeURIComponent(b.dataset.id),{method:'POST'}); await load();
  });
}

/* ── CONNECTORS ───────────────────────────────────────────────────────── */
const VENDOR_LABEL={claude_code:'Claude Code',codex:'Codex',openclaw:'OpenClaw',hermes:'Hermes',bedrock:'Amazon Bedrock',vertex:'Google Vertex',foundry:'Microsoft AI Foundry',cloudflare:'Cloudflare Workers'};
function renderConnectors(page){
  const synced=FLEET.connectors||[];
  const byV=Object.fromEntries(synced.map(c=>[c.vendor,c]));
  const localVendors=['claude_code','codex'];
  const all=['claude_code','codex','openclaw','hermes','vertex','bedrock','foundry','cloudflare'];
  const invByV={}; FLEET.inventory.forEach(a=>invByV[a.vendor]=(invByV[a.vendor]||0)+1);

  const intro=el('div'); intro.style.cssText='color:var(--dim);font-size:13px;margin-bottom:16px;max-width:640px';
  intro.innerHTML=`AnveInspect reuses the platform CLIs you're already signed into — no API keys to paste. Run <span class="mono" style="color:var(--info)">anveinspect doctor</span> to connect everything, or <span class="mono" style="color:var(--info)">/anveinspect:setup</span> from Claude.`;
  page.appendChild(intro);

  const grid=el('div','conn-grid');
  all.forEach(v=>{
    const card=el('div','conn');
    const count=invByV[v]||0;
    const s=byV[v];
    let stClass,stText,detail,fix='';
    if(localVendors.includes(v)){ stClass='ready';stText='local';detail='Reads local logs — no signin needed.'; }
    else if(s && s.error){ stClass='err';stText='error';detail=s.error; }
    else if(s && s.agentCount>=0 && !s.error){ stClass='ready';stText='connected';detail='Synced '+rel(s.syncedAt)+'.'+(s.warnings&&s.warnings.length?' '+s.warnings[0]:''); }
    else { stClass='wait';stText='connect';detail='Not connected yet — reuse your CLI login.';fix=fixFor(v); }
    card.innerHTML=`<div class="top"><span class="name">${VENDOR_LABEL[v]||v}</span><span class="st ${stClass}">${stText}</span></div>
      <div class="count">${count} <small>agent${count===1?'':'s'} in inventory</small></div>
      <div class="detail">${esc(detail)}</div>${fix?`<div class="fix">${esc(fix)}</div>`:''}`;
    grid.appendChild(card);
  });
  page.appendChild(grid);
}
function fixFor(v){return {vertex:'gcloud auth login',bedrock:'aws configure  (or aws sso login)',cloudflare:'anveinspect connectors set cloudflare apiToken <token>',foundry:'az login'}[v]||'anveinspect connectors init';}

/* ── Agent detail drawer ──────────────────────────────────────────────── */
const drawer=$('#drawer'), scrim=$('#scrim');
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
function closeDrawer(){drawer.classList.remove('on');scrim.classList.remove('on');drawerKey=null;}
/* Two guards, both load-bearing once double-click exists:
   - drawerSeq: openAgent awaits a fetch then overwrites innerHTML unconditionally.
     Open A then B and A's slower reply would land on top of B. Only the newest
     request may paint.
   - drawerKey/At: a double-click fires two mouseups, so the first click already
     opened this exact agent. Swallow the repeat, but let a deliberate re-click
     through as a refresh. */
let drawerSeq=0, drawerKey=null, drawerAt=0;
async function openAgent(name, fp){
  const key=fp||name;
  if(drawer.classList.contains('on')&&drawerKey===key&&performance.now()-drawerAt<700)return;
  drawerKey=key; drawerAt=performance.now();
  const seq=++drawerSeq;
  drawer.classList.add('on');scrim.classList.add('on');
  drawer.innerHTML=`<div class="dw-hd"><div><div class="title">${esc(name)}</div></div><button class="dw-close">✕</button></div><div class="dw-bd"><div class="empty">loading…</div></div>`;
  drawer.querySelector('.dw-close').onclick=closeDrawer;
  // query by fingerprint when we have one: agentDetail resolves a display name with
  // ORDER BY last_run_at LIMIT 1, and 46 of 159 agents share a name, so a name
  // lookup can return a different agent than the one that was clicked.
  const d=await fetch('/api/agent?name='+encodeURIComponent(key)).then(r=>r.json()).catch(()=>null);
  if(seq!==drawerSeq)return; // superseded by a newer open
  if(!d||d.error){ drawer.querySelector('.dw-bd').innerHTML=`<div class="empty">${esc(d?.error||'not found')}</div>`; return; }
  const a=d.agent;
  const runs=d.recentRuns||[];
  const withTok=runs.filter(r=>r.tokens!=null).map(r=>r.tokens);
  const totalTok=withTok.reduce((s,t)=>s+t,0);
  const maxTok=Math.max(1,...withTok);
  const spark=runs.slice(0,24).reverse().map(r=>`<i style="height:${r.tokens==null?2:Math.max(2,Math.round(r.tokens/maxTok*44))}px" title="${r.tokens==null?'unavailable':fmt(r.tokens)+' tok'}"></i>`).join('');
  const dotOf=s=>({completed:'var(--ok)',healthy:'var(--ok)',error:'var(--red)',unknown_end:'var(--amber)'}[s]||'var(--dim)');
  drawer.innerHTML=`
    <div class="dw-hd">
      <div><div class="title">${esc(a.display_name)}</div>
        <div class="subs"><span class="vtag">${esc(a.vendor.replace('_',' '))}</span><span>${esc(a.trigger_source)}</span><span>·</span><span>${a.source==='platform_connector'?'platform connector':'local'}</span></div>
      </div><button class="dw-close">✕</button>
    </div>
    <div class="dw-bd">
      <div class="dw-stats">
        <div class="dw-stat"><div class="l">Recent runs</div><div class="v">${runs.length}</div></div>
        <div class="dw-stat"><div class="l">Subagent spawns</div><div class="v">${d.subagentSpawns}</div></div>
        <div class="dw-stat"><div class="l">Tokens (recent)</div><div class="v">${withTok.length?fmt(totalTok):'—'}</div></div>
      </div>
      <div class="dw-sec">Tags <span style="color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400">— local grouping, never touches the platform</span></div>
      <div class="dw-tags" id="dwTags"></div>
      <div class="dw-sec">Cadence</div>
      <div class="dw-cad">${d.cadence?`<span class="on">${esc(d.cadence.expect)}</span> · grace ${d.cadence.grace_minutes}m · ${d.cadence.declared?'declared':'inferred'} · set via ${esc(d.cadence.origin)} ${esc((d.cadence.updated_at||'').slice(0,10))}`:'No cadence declared. Ask Claude: "watch '+esc(a.display_name)+', it runs daily at &lt;time&gt;" — or run <span class="mono">anveinspect cadence declare '+esc(a.display_name)+' "daily HH:MM"</span>'}</div>
      <div class="dw-sec">Token trend (recent runs)</div>
      ${withTok.length?`<div class="dw-spark">${spark}</div>`:'<div class="dw-cad">No token data — this agent is catalog-only or its transcripts are unavailable.</div>'}
      ${relSection(a.fingerprint)}
      <div class="dw-sec">Spawn tree</div>
      <div class="dw-tree" id="dwTree"><div class="dw-cad">loading…</div></div>
      ${costSection(d)}
      ${toolSection(d, a)}
      <div class="dw-sec">Run history</div>
      <div class="dw-runs">${runs.length?runs.slice(0,20).map(r=>`<div class="dw-run"><span class="dot" style="background:${dotOf(r.status)}"></span><span class="ts">${esc((r.startedAt||'').replace('T',' ').slice(0,19))}</span><span>${esc(r.status)}</span><span class="tk">${r.tokens==null?'unavail':fmt(r.tokens)}</span></div>`).join(''):'<div class="dw-run">no runs recorded</div>'}</div>
    </div>`;
  drawer.querySelector('.dw-close').onclick=closeDrawer;
  // relationship rows drill sideways into the other agent
  drawer.querySelectorAll('[data-relfp]').forEach(row=>row.onclick=()=>{
    openAgent(row.dataset.relname, row.dataset.relfp);
    if(currentRoute()==='lineage'&&GRAPH) focusAgent(row.dataset.relfp);
  });
  const fb=drawer.querySelector('#dwFocus');
  if(fb) fb.onclick=()=>focusAgent(a.fingerprint);
  renderTags(a.display_name, d.tags||[]);
  loadSpawnTree(d, seq);
}

/* The drawer's run-level tree. agentDetail returns run ids but not which one
   spawned the most, so pick the busiest via /api/timeline and render the real
   tree with the existing treeNode(). */
async function loadSpawnTree(d, seq){
  const box=$('#dwTree'); if(!box)return;
  const runs=(d.recentRuns||[]).map(r=>r.id).slice(0,8);
  if(!d.subagentSpawns||!runs.length){
    box.innerHTML='<div class="dw-cad">This agent has not spawned any subagents.</div>'; return;
  }
  let best=null;
  for(const id of runs){
    const t=await fetch('/api/lineage/tree?run='+encodeURIComponent(id)).then(r=>r.ok?r.json():null).catch(()=>null);
    if(seq!==drawerSeq)return; // drawer moved on
    if(t&&t.children&&t.children.length&&(!best||t.children.length>best.children.length))best=t;
    if(best&&best.children.length>=20)break; // good enough, stop hammering
  }
  if(seq!==drawerSeq)return;
  box.innerHTML='';
  if(!best){ box.innerHTML='<div class="dw-cad">No spawn tree recorded on this agent\u2019s recent runs.</div>'; return; }
  const cap=el('div','dw-cad'); cap.textContent=`busiest recent run \u00b7 ${best.children.length} direct \u00b7 ${best.descendantCount} descendants`;
  box.appendChild(cap); box.appendChild(treeNode(best,0));
}

/* Relationships come from GRAPH.edges, which already carries spawns, tokens and
   the chars exchanged each way. GRAPH is only fetched by renderLineage, so it is
   null on every other route — say "open Lineage" rather than "no relationships",
   because those mean very different things. */
function relSection(fp){
  if(!GRAPH) return `<div class="dw-sec">Relationships</div><div class="dw-cad">Open the Lineage view to load the relationship graph.</div>`;
  const nm={}; GRAPH.nodes.forEach(n=>nm[n.fingerprint]=n);
  const kids=GRAPH.edges.filter(e=>e.source===fp);
  const pars=GRAPH.edges.filter(e=>e.target===fp);
  const row=(e,other,dir)=>{
    const o=nm[other]||{name:other.slice(0,12),vendor:'unknown'};
    const vol=[e.dataDown!=null?fmt(e.dataDown)+' ch ↓':null,e.dataUp!=null?fmt(e.dataUp)+' ch ↑':null].filter(Boolean).join(' · ');
    return `<div class="dw-rel" data-relfp="${esc(other)}" data-relname="${esc(o.name)}">
      <span class="dir">${dir}</span>
      <span class="rn">${esc(o.name)}</span><span class="vtag">${esc((o.vendor||'').replace('_',' '))}</span>
      <span class="rm">${fmt(e.spawns)}× · ${e.tokens==null?'tokens unavail':fmt(e.tokens)+' tok'}${vol?' · '+vol:''}</span></div>`;
  };
  if(!kids.length&&!pars.length)
    return `<div class="dw-sec">Relationships</div><div class="dw-cad">No spawn relationships recorded${GRAPH.truncated?' among the heaviest '+GRAPH.edges.length+' shown':''}.</div>`;
  return `<div class="dw-sec">Relationships${GRAPH.truncated?' <span style="color:var(--amber);text-transform:none;letter-spacing:0;font-weight:400">— graph capped, may be incomplete</span>':''}</div>
    <div class="dw-rels">
      ${pars.map(e=>row(e,e.source,'↑ spawned by')).join('')}
      ${kids.map(e=>row(e,e.target,'↓ spawns')).join('')}
    </div>`;
}

/* Cost is an undercount whenever a model has no rate, so never print a bare
   number — the count of unpriced runs travels with it. */
function costSection(d){
  const c=d.cost; if(!c) return '';
  const caveat=[];
  if(c.unpricedRuns) caveat.push(`${c.unpricedRuns} run${c.unpricedRuns===1?'':'s'} unpriced`);
  if(c.partialRuns)  caveat.push(`${c.partialRuns} partially priced`);
  const missing=(c.unpricedModels||[]).map(m=>`${m.model} (${m.runs} run${m.runs===1?'':'s'}, ${fmt(m.tokens)} tok)`).join(', ');
  const models=(d.models||[]).map(m=>`<div class="dw-run"><span class="ts mono">${esc(m.model)}</span><span class="tk">${m.runs} run${m.runs===1?'':'s'}</span></div>`).join('');
  return `<div class="dw-sec">Cost · last ${d.windowDays}d</div>
    <div class="dw-stats">
      <div class="dw-stat"><div class="l">Estimated</div><div class="v">${c.usd==null?'—':fmtUsd(c.usd)}</div></div>
      <div class="dw-stat"><div class="l">Tokens</div><div class="v">${d.tokensTotal==null?'—':fmt(d.tokensTotal)}</div></div>
      <div class="dw-stat"><div class="l">Runs priced</div><div class="v">${c.pricedRuns}/${d.windowRunCount}</div></div>
    </div>
    ${caveat.length?`<div class="dw-cad" style="color:var(--amber)">Undercount — ${caveat.join(', ')}. Unrated models contribute nothing to the total.${missing?`<br>No rate for: <span class="mono">${esc(missing)}</span>. Add them to <span class="mono">~/.anveinspect/pricing.json</span>.`:''}</div>`:''}
    ${models?`<div class="dw-runs">${models}</div>`:''}`;
}

/* Codex writes an empty tool_call_counts blob, so "no tools" there means the
   platform does not report them — not that none were used. */
function toolSection(d, a){
  const tools=d.toolCalls||[], mcp=d.mcpServers||[];
  if(!tools.length){
    const why=a.vendor==='codex'?'This platform does not report tool usage.':'No tool calls recorded in this window.';
    return `<div class="dw-sec">Tools</div><div class="dw-cad">${why}</div>`;
  }
  return `<div class="dw-sec">Tools · ${d.runsWithTools} of ${d.windowRunCount} runs</div>
    <div class="dw-chips">${tools.slice(0,12).map(t=>`<span class="dw-chip">${esc(t.name.replace(/^mcp__/,'').replace(/__/g,' · '))}<b>${fmt(t.calls)}</b></span>`).join('')}</div>
    ${mcp.length?`<div class="dw-sec">MCP servers</div>
      <div class="dw-chips">${mcp.slice(0,10).map(m=>`<span class="dw-chip mcp">${esc(m.server)}<b>${fmt(m.calls)}</b></span>`).join('')}</div>`:''}`;
}
function renderTags(agentName, tags){
  const box=$('#dwTags'); if(!box)return;
  box.innerHTML=tags.map(t=>`<span class="tag-chip">#${esc(t)}<span class="tag-x" data-tag="${esc(t)}">×</span></span>`).join('')
    +`<span class="tag-add" id="tagAdd">+ tag</span>`;
  box.querySelectorAll('.tag-x').forEach(x=>x.onclick=async(e)=>{e.stopPropagation();
    await fetch('/api/untag',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:agentName,tag:x.dataset.tag})});
    const d=await fetch('/api/agent?name='+encodeURIComponent(agentName)).then(r=>r.json()); renderTags(agentName,d.tags||[]); load();});
  $('#tagAdd').onclick=()=>{
    const inp=el('input','tag-input'); inp.placeholder='tag…'; $('#tagAdd').replaceWith(inp); inp.focus();
    inp.onkeydown=async(e)=>{ if(e.key==='Enter'&&inp.value.trim()){
      await fetch('/api/tag',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:agentName,tag:inp.value.trim()})});
      const d=await fetch('/api/agent?name='+encodeURIComponent(agentName)).then(r=>r.json()); renderTags(agentName,d.tags||[]); load();
    } if(e.key==='Escape')renderTags(agentName,tags); };
  };
}

/* ── tooltip ──────────────────────────────────────────────────────────── */
const tt=$('#tt');
function showTip(e,day,val){tt.innerHTML=`<div class="t-day">${esc(day)}</div><div class="t-val">${esc(val)}</div>`;tt.style.opacity='1';tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function hideTip(){tt.style.opacity='0';}

load();
setInterval(load, 60000); // live refresh every minute
</script>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #10141B;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="61"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="6"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-reveal"
        class="scene"
        data-composition-id="03-reveal"
        data-composition-src="compositions/frames/03-reveal.html"
        data-start="13"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-04-inventory"
        class="scene"
        data-composition-id="04-inventory"
        data-composition-src="compositions/frames/04-inventory.html"
        data-start="20"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-lineage"
        class="scene"
        data-composition-id="05-lineage"
        data-composition-src="compositions/frames/05-lineage.html"
        data-start="27"
        data-duration="9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-insight"
        class="scene"
        data-composition-id="06-insight"
        data-composition-src="compositions/frames/06-insight.html"
        data-start="36"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-paging"
        class="scene"
        data-composition-id="07-paging"
        data-composition-src="compositions/frames/07-paging.html"
        data-start="42"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-08-zeroinstall"
        class="scene"
        data-composition-id="08-zeroinstall"
        data-composition-src="compositions/frames/08-zeroinstall.html"
        data-start="49"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-09-cta"
        class="scene"
        data-composition-id="09-cta"
        data-composition-src="compositions/frames/09-cta.html"
        data-start="55"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-problem", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-03-reveal", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-04-inventory", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-05-lineage", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to("#el-06-insight", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 42);
        tl.fromTo("#el-07-paging", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 42);
        tl.to("#el-08-zeroinstall", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 55);
        tl.fromTo("#el-09-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 55);
        tl.to({}, { duration: 61 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>

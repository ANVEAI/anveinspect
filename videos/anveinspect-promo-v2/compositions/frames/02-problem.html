    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      /* ---- music grid (118bpm) ---- */
      var BEAT = 0.5085;
      var HALF = BEAT / 2;

      /* ---- build the 15 connector lines (deterministic, synchronous) ---- */
      var CENTERS = [
        [540, 385],
        [960, 385],
        [1380, 385],
        [540, 555],
        [960, 555],
        [1380, 555]
      ];
      var pairs = [];
      var a, b, k;
      for (a = 0; a < 6; a++) {
        for (b = a + 1; b < 6; b++) pairs.push([a, b]);
      }
      var net = document.getElementById("p2-net");
      var lines = [];
      var SVGNS = "http://www.w3.org/2000/svg";
      for (k = 0; k < 15; k++) {
        /* deterministic shuffle: gcd(7,15)=1 so (k*7)%15 visits every pair once,
           making the draw order crisscross instead of sweeping row by row */
        var p = pairs[(k * 7) % 15];
        var x1 = CENTERS[p[0]][0],
          y1 = CENTERS[p[0]][1],
          x2 = CENTERS[p[1]][0],
          y2 = CENTERS[p[1]][1];
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("id", "p2-ln" + k);
        ln.setAttribute("x1", x1);
        ln.setAttribute("y1", y1);
        ln.setAttribute("x2", x2);
        ln.setAttribute("y2", y2);
        ln.setAttribute("stroke", "#eef2f7");
        ln.setAttribute("stroke-width", "1");
        ln.setAttribute("opacity", "0.4");
        var len = Math.hypot(x2 - x1, y2 - y1);
        ln.style.strokeDasharray = len;
        ln.style.strokeDashoffset = len;
        net.appendChild(ln);
        lines.push(ln);
      }

      /* ---- prep tick paths (svg-path-draw: dasharray = measured length) ---- */
      var tickPaths = document.querySelectorAll("#p2-chips .ticks path");
      tickPaths.forEach(function (tp) {
        var tlen = tp.getTotalLength();
        tp.style.strokeDasharray = tlen;
        tp.style.strokeDashoffset = tlen;
      });

      var tl = gsap.timeline({ paused: true });

      /* ================= CHROME (binds the film) ================= */
      /* progress rail: frame 2 of 9 -> fill animates 1/9 -> 2/9 across all 7s */
      tl.fromTo("#p2-rail", { scaleX: 1 / 9 }, { scaleX: 2 / 9, duration: 7, ease: "none" }, 0);
      /* kicker mask-wipes in during the first second (two properties: clip + x) */
      tl.fromTo(
        "#p2-kicker",
        { clipPath: "inset(0 100% 0 0)", x: -14 },
        { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.8, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        "#p2-num",
        { opacity: 0, y: -8 },
        { opacity: 0.3, y: 0, duration: 0.6, ease: "power2.out" },
        0.2
      );

      /* ================= GROUND: one very slow glow drift ================= */
      tl.fromTo("#p2-glow", { x: -30, y: 10 }, { x: 30, y: -10, duration: 7, ease: "sine.inOut" }, 0);

      /* ================= SCENE 1 (0.0-2.0s): chips snap onto the grid ================= */
      /* macro camera: one slow push-in under the whole lattice shot */
      tl.fromTo("#p2-latwrap", { scale: 1 }, { scale: 1.045, duration: 4, ease: "none" }, 0);

      var c;
      for (c = 0; c < 6; c++) {
        var chipT = 0.2 + c * HALF; /* staggered on the half-beat grid */
        tl.fromTo(
          "#p2-chip" + c,
          { scale: 1.18, opacity: 0, filter: "blur(10px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          chipT
        );
        /* corner-tick draw lands with each chip */
        var t;
        var abc = ["a", "b", "c", "d"];
        for (t = 0; t < 4; t++) {
          tl.to(
            "#p2-tk" + c + abc[t],
            { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
            chipT + 0.16 + t * 0.04
          );
        }
      }

      /* ================= SCENE 2 (2.0-4.0s): connectors try to link everything ================= */
      tl.fromTo("#p2-net", { opacity: 0.7 }, { opacity: 1, duration: 1.8, ease: "none" }, 2.0);
      for (k = 0; k < 15; k++) {
        tl.to(
          lines[k],
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          2.0 + k * 0.085
        );
      }
      /* chips dim as the tangle brightens */
      tl.to("#p2-chips", { opacity: 0.45, duration: 1.2, ease: "power1.inOut" }, 2.6);

      /* two connectors glitch-flicker (deterministic 2-frame opacity stutters) */
      tl.set(lines[4], { opacity: 0.05 }, 3.3);
      tl.set(lines[4], { opacity: 0.4 }, 3.38);
      tl.set(lines[4], { opacity: 0.08 }, 3.46);
      tl.set(lines[4], { opacity: 0.4 }, 3.54);
      tl.set(lines[11], { opacity: 0.05 }, 3.58);
      tl.set(lines[11], { opacity: 0.4 }, 3.66);
      tl.set(lines[11], { opacity: 0.1 }, 3.74);
      tl.set(lines[11], { opacity: 0.4 }, 3.82);

      /* SCENE 3 (4.0-4.5s): overload snap — the lattice clip's window ends at 4.0s,
         so everything hard-cuts to black (ground system only) for one full beat. */

      /* ================= SCENE 4 (4.5-7.0s): the payoff ================= */
      /* gentle settle drift under the held read */
      tl.fromTo("#p2-paywrap", { scale: 1 }, { scale: 1.018, duration: 2.5, ease: "none" }, 4.5);

      /* "six platforms." per-word slam — distinct entrances (kinetic-beat-slam) */
      tl.fromTo(
        "#p2-w1",
        { scale: 1.5, opacity: 0, filter: "blur(16px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        4.56
      );
      tl.fromTo(
        "#p2-w2",
        { x: -320, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
        4.56 + HALF
      );

      /* "zero visibility." on the next bar — "zero" is the accent payoff */
      tl.fromTo(
        "#p2-w3",
        { scale: 1.4, opacity: 0, filter: "blur(12px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        4.56 + 2 * BEAT
      );
      tl.fromTo(
        "#p2-w4",
        { x: 280, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
        4.56 + 2 * BEAT + HALF
      );

      /* accent underline draws left-to-right under "zero", then held read to 7s */
      tl.fromTo(
        "#p2-under",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        6.15
      );

      window.__timelines["02-problem"] = tl;
    </script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ---- ring: measured circumference (svg-path-draw / stat-bars-and-fills ring form) ---- */
    const ringFill = document.getElementById("in06-ring-fill");
    const ringGlowArc = document.getElementById("in06-ring-glowarc");
    const LEN = ringFill.getTotalLength();
    ringFill.style.strokeDasharray = `${LEN}`;
    ringFill.style.strokeDashoffset = `${LEN}`; /* empty at t=0 */
    /* shimmer arc holds the ring's FINAL 288-degree geometry statically (revealed by opacity only) */
    ringGlowArc.style.strokeDasharray = `${LEN}`;
    ringGlowArc.style.strokeDashoffset = `${LEN * 0.2}`;

    /* =================== CHROME (0.0s -> full frame) =================== */
    /* progress rail: frame 6 of 9 -> fill 5/9 -> 6/9 linearly across all 6s */
    tl.fromTo("#in06-rail",
      { scaleX: 5 / 9 },
      { scaleX: 6 / 9, duration: 6, ease: "none" },
      0);
    /* kicker mask-wipes in during the first second */
    tl.fromTo("#in06-kicker",
      { clipPath: "inset(0 100% 0 0)", opacity: 0.9 },
      { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.7, ease: "power3.out" },
      0.1);
    tl.fromTo("#in06-framenum",
      { opacity: 0 },
      { opacity: 1, duration: 0.6, ease: "power2.out" },
      0.2);

    /* ground: one very slow glow drift under everything (single finite pass) */
    tl.fromTo("#in06-glow",
      { scale: 1 },
      { scale: 1.07, duration: 6, ease: "sine.inOut" },
      0);

    /* =================== SCENE 1 (0.0 - 1.8s): ring sweep + count-up =================== */
    /* dim 1px track fades up first */
    tl.fromTo("#in06-ring-track",
      { opacity: 0 },
      { opacity: 1, duration: 0.4, ease: "power2.out" },
      0.05);
    /* the sweep: strokeDashoffset LEN -> LEN*0.2 == exactly 288 degrees (80%) */
    tl.to(ringFill,
      { strokeDashoffset: LEN * 0.2, duration: 1.65, ease: "power3.out" },
      0.15);
    /* count-up with dynamic scale — value AND font-size in ONE tween, same ease as the ring
       so number + ring land as one beat (counting-dynamic-scale) */
    const numEl = document.getElementById("in06-num");
    const numState = { v: 0, fs: 170 };
    tl.to(numState,
      {
        v: 80, fs: 300, duration: 1.65, ease: "power3.out",
        onUpdate: () => {
          numEl.textContent = Math.round(numState.v);
          numEl.style.fontSize = `${numState.fs}px`;
        }
      },
      0.15);
    /* "%" suffix arrives as the count lands (no overshoot — reserved for frame 3) */
    tl.fromTo("#in06-pct",
      { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.55);

    /* =================== SCENE 2 (1.8 - 3.2s): "of your agent runs" =================== */
    /* per-word y+blur rise (two properties minimum) */
    tl.fromTo(".in06-wa",
      { y: 44, opacity: 0, filter: "blur(12px)" },
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.18 },
      1.85);

    /* =================== SCENE 3 (3.2 - 4.6s): "are agents spawning agents." =================== */
    /* x-snap per word, expo (kinetic-beat-slam side-snap entrance) */
    tl.fromTo(".in06-wb",
      { x: -72, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "expo.out", stagger: 0.16 },
      3.25);

    /* =================== SCENE 4 (4.6 - 6.0s): sub-line + HELD READ =================== */
    tl.fromTo("#in06-sub",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
      4.65);
    /* ring stroke shimmer — ONE finite low-amplitude pass, then stillness (no exit) */
    tl.to(ringGlowArc,
      { opacity: 0.38, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
      4.9);

    window.__timelines["06-insight"] = tl;
  </script>

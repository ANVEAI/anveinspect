    <script>
      window.__timelines = window.__timelines || {};

      /* ---- the 118bpm grid: every onset reads from this ---- */
      const BEAT = 0.5085; /* seconds per beat @118bpm */
      const B1 = 0.20;            /* beat 1 slam        */
      const B2 = BEAT * 2;        /* 1.017 — beat 2     */
      const B3 = BEAT * 4;        /* 2.034 — beat 3     */
      const SWAP = BEAT * 6;      /* 3.051 — scale-swap */
      const TICKS = [3.60, 3.95, 4.30];
      const SPLIT = BEAT * 9;     /* 4.5765 — divider   */
      const TYPE_AT = 4.70;

      /* ---- svg tick self-draw prep (measured, not guessed) ---- */
      const zi8TickPaths = [
        document.getElementById("zi8-tickpath1"),
        document.getElementById("zi8-tickpath2"),
        document.getElementById("zi8-tickpath3"),
      ];
      zi8TickPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      const tl = gsap.timeline({ paused: true });

      /* ================= chrome (binds the film) ================= */
      /* progress rail: frame 8 of 9 — fill 7/9 -> 8/9 across the full 6s */
      tl.fromTo("#zi8-rail", { scaleX: 7 / 9 }, { scaleX: 8 / 9, duration: 6, ease: "none" }, 0);
      /* kicker mask-wipes in during the first second */
      tl.fromTo("#zi8-kicker", { xPercent: -104 }, { xPercent: 0, duration: 0.55, ease: "power3.out" }, 0.12);
      tl.fromTo("#zi8-num", { opacity: 0 }, { opacity: 0.35, duration: 0.5, ease: "power2.out" }, 0.25);

      /* ================= ground: one slow glow drift ================= */
      tl.fromTo("#zi8-glow", { x: -34, y: -10 }, { x: 34, y: 16, duration: 6, ease: "sine.inOut" }, 0);

      /* ===== log column: one long deterministic upward drift (~4px/s) ===== */
      tl.fromTo("#zi8-log", { y: 12 }, { y: -14, duration: 6, ease: "none" }, 0);

      /* ================= Scene 1 (0–3s): beat slams ================= */
      /* distinct entrances per beat (kinetic-beat-slam): scale-blur / x-snap / rise-rotate */
      tl.fromTo(
        "#zi8-beat1",
        { scale: 1.55, opacity: 0, filter: "blur(18px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        B1,
      );
      /* hard-cut replace on the next bar line */
      tl.set("#zi8-beat1", { opacity: 0 }, B2);
      tl.fromTo(
        "#zi8-beat2",
        { x: -360, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        B2,
      );
      tl.set("#zi8-beat2", { opacity: 0 }, B3);
      tl.fromTo(
        "#zi8-beat3",
        { y: 110, rotation: 5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
        B3,
      );

      /* ============ Scene 2 (3.0–4.5s): scale-swap into the checklist ============ */
      /* outgoing rushes away (power2.in), incoming arrives with weight (back.out) */
      tl.to("#zi8-beat3", { scale: 0.72, opacity: 0, duration: 0.32, ease: "power2.in" }, SWAP);
      tl.fromTo(
        "#zi8-checklist",
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
        SWAP + 0.32 - 0.15,
      );
      /* three accent ticks self-draw, staggered; each row brightens as its tick completes */
      zi8TickPaths.forEach((p, i) => {
        tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, TICKS[i]);
        tl.to("#zi8-row" + (i + 1), { opacity: 1, duration: 0.3, ease: "power2.out" }, TICKS[i] + 0.15);
      });

      /* ============ Scene 3 (4.5–6.0s): divider + typed one-liner ============ */
      tl.fromTo(
        "#zi8-divider",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        SPLIT,
      );

      /* typewriter — smooth per-char slice, deterministic */
      const zi8Line = "it reads the logs your agents already write.";
      const zi8TypedEl = document.getElementById("zi8-typed");
      const zi8Len = { v: 0 };
      tl.to(
        zi8Len,
        {
          v: zi8Line.length,
          duration: 1.0,
          ease: "power1.inOut",
          onUpdate: () => {
            zi8TypedEl.textContent = zi8Line.substring(0, Math.floor(zi8Len.v));
          },
        },
        TYPE_AT,
      );

      /* block caret — deterministic sin blink (no CSS animation, no repeat) */
      const zi8CaretEl = document.getElementById("zi8-caret");
      const zi8Blink = { p: 0 };
      tl.to(
        zi8Blink,
        {
          p: Math.PI * 2 * 2,
          duration: 6 - (SPLIT + 0.1),
          ease: "none",
          onUpdate: () => {
            zi8CaretEl.style.opacity = Math.sin(zi8Blink.p + 0.4) > 0 ? "1" : "0.15";
          },
        },
        SPLIT + 0.1,
      );

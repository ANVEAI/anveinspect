  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    // 118 bpm grid — the silent piece's reveal cues (beat = 0.5085s, bar = 2.0339s)
    const P = 60 / 118;
    const B1 = 2 * P; // 1.017  — beat 2: "no API keys."
    const B2 = 4 * P; // 2.034  — bar 2:  "no code changes."
    const SWAP = 6 * P; // 3.051 — bar 3 half: scale-swap into checklist
    const T1 = 6.5 * P, T2 = 7 * P, T3 = 7.5 * P; // 3.31 / 3.56 / 3.81 — staggered tick draws
    const TYPE_AT = 9 * P; // 4.576 — Scene 3: mono type-on

    // SVG self-draw setup: measure each tick path (dynamic geometry, not magic numbers)
    document.querySelectorAll(".zi8-tick").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = `${len}`;
      p.style.strokeDashoffset = `${len}`;
    });

    const tl = gsap.timeline({ paused: true });

    /* ---- chrome fades up ---- */
    tl.fromTo(
      [".zi8-kicker", ".zi8-num"],
      { opacity: 0, y: -14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0.25
    );

    /* ---- Scene 1 : kinetic beat-slam — one onset array, distinct entrance per beat ---- */
    // beat 1 — slam: scale + blur, hard settle
    tl.fromTo(
      "#zi8-b1",
      { scale: 1.5, filter: "blur(16px)", opacity: 0 },
      { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );
    // hard cut out on the next onset (no roll, no fade tail)
    tl.to("#zi8-b1", { opacity: 0, duration: 0.02, ease: "none" }, B1);

    // beat 2 — side snap
    tl.fromTo(
      "#zi8-b2",
      { x: -340, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
      B1
    );
    tl.to("#zi8-b2", { opacity: 0, duration: 0.02, ease: "none" }, B2);

    // beat 3 — heavy rise with momentum
    tl.fromTo(
      "#zi8-b3",
      { y: 110, rotation: 2.5, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
      B2
    );

    /* ---- Scene 2 : scale-swap — full-screen line morphs into the checklist stack ---- */
    // outgoing rushes away (power2.in), incoming arrives with weight (back.out), 0.15s overlap
    tl.to("#zi8-b3", { scale: 0.72, opacity: 0, duration: 0.32, ease: "power2.in" }, SWAP);
    tl.fromTo(
      "#zi8-panel",
      { scale: 0.78, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
      SWAP + 0.32 - 0.15
    );

    // green ticks self-draw, staggered on the half-beat grid; each item brightens with its tick
    [
      ["#zi8-tick1", "#zi8-i1", T1],
      ["#zi8-tick2", "#zi8-i2", T2],
      ["#zi8-tick3", "#zi8-i3", T3],
    ].forEach(([tick, item, t]) => {
      tl.to(tick, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t);
      tl.to(item, { opacity: 1, duration: 0.3, ease: "power3.out" }, t);
    });

    /* ---- Scene 3 : mono type-on with caret, right of the stack ---- */
    const LINE = "it reads the logs your agents already write.";
    const typeEl = document.getElementById("zi8-type");
    const caretEl = document.getElementById("zi8-caret");

    tl.fromTo(
      "#zi8-lineblock",
      { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power1.out" },
      TYPE_AT - 0.08
    );

    // smooth character slice — deterministic substring off a driven counter
    const len = { v: 0 };
    tl.to(
      len,
      {
        v: LINE.length,
        duration: 1.0,
        ease: "none",
        onUpdate: () => {
          typeEl.textContent = LINE.substring(0, Math.floor(len.v));
        },
      },
      TYPE_AT
    );

    // caret blink — deterministic sin, never a CSS animation (2 cycles across the scene tail)
    const blink = { p: 0 };
    tl.to(
      blink,
      {
        p: Math.PI * 2 * 2,
        duration: 1.5,
        ease: "none",
        onUpdate: () => {
          caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
        },
      },
      TYPE_AT - 0.08
    );

    // held read on the settle: one slow, non-repeating micro-push (no exit — root transition owns that)
    tl.to("#zi8-panel", { scale: 1.012, duration: 1.3, ease: "sine.inOut" }, 4.7);

    window.__timelines["08-zeroinstall"] = tl;
  </script>

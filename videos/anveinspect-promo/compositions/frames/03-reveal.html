<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is source-file metadata only; the runtime clones template contents -->
  </head>
  <body>
    <template>
      <style>
        /* Root styled via #root (never a class on the composition root) */
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          /* No background here — the full-bleed ground lives on the clip layer below */
        }

        /* ── Full-bleed ground (track 0 clip) — ink-black register ── */
        .bg-ground {
          position: absolute;
          inset: 0;
          background: #0a0d12;
        }

        /* ── Stage (track 1 clip) — all animated content ── */
        .stage {
          position: absolute;
          inset: 0;
        }

        /* Layer 1 — accent glow ground behind the docked UI (blooms in Scene 4) */
        .ui-glow {
          position: absolute;
          z-index: 1;
          left: 260px;
          top: 160px;
          width: 1400px;
          height: 740px;
          background: radial-gradient(
            ellipse 55% 50% at 50% 55%,
            rgba(62, 207, 142, 0.5) 0%,
            rgba(62, 207, 142, 0.18) 40%,
            rgba(62, 207, 142, 0) 72%
          );
          opacity: 0;
          transform-origin: 50% 50%;
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* Layer 2 — the real dashboard, docks lower two-thirds with a 6° tilt */
        .card-persp {
          position: absolute;
          z-index: 2;
          inset: 0;
          perspective: 1500px;
          perspective-origin: 50% 38%;
        }
        .ui-card {
          position: absolute;
          left: calc(50% - 560px);
          top: 255px;
          width: 1120px;
          background: #0a0d12;
          border: 1px solid rgba(238, 242, 247, 0.16);
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .ui-card img {
          display: block;
          width: 100%;
          height: auto;
        }

        /* Layer 3 — wordmark lockup + tagline (yields the upper third in Scene 3) */
        .lockup {
          position: absolute;
          z-index: 3;
          left: 0;
          right: 0;
          top: 330px;
          display: flex;
          flex-direction: column;
          align-items: center;
          transform-origin: 50% 0%;
          will-change: transform;
        }
        .wordrow {
          display: flex;
          align-items: center;
        }
        .pulse-dot {
          width: 24px;
          height: 24px;
          margin-right: 30px;
          border-radius: 50%;
          background: #3ecf8e;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .word {
          font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
          font-weight: 700;
          font-size: 130px;
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: #eef2f7;
          text-transform: lowercase;
          white-space: nowrap;
        }
        .word .lt {
          display: inline-block;
          transform-origin: 50% 80%;
          will-change: transform, opacity;
        }
        .tagline {
          margin-top: 44px;
          display: flex;
          align-items: baseline;
          font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-weight: 500;
          font-size: 33px;
          letter-spacing: 0.04em;
          color: #afb7b3;
          min-height: 42px;
        }
        .caret {
          display: inline-block;
          width: 15px;
          height: 32px;
          margin-left: 4px;
          background: #3ecf8e;
          align-self: center;
          opacity: 0;
          will-change: opacity;
        }
      </style>

      <div id="root" data-composition-id="03-reveal" data-duration="7" data-width="1920" data-height="1080">
        <!-- Track 0: full-bleed ground -->
        <div class="clip bg-ground" data-start="0" data-duration="7" data-track-index="0"></div>

        <!-- Track 1: stage -->
        <div class="clip stage" data-start="0" data-duration="7" data-track-index="1">
          <div class="ui-glow" id="r3-glow"></div>

          <div class="card-persp">
            <div class="ui-card" id="r3-card">
              <img src="assets/view-overview.png" alt="" />
            </div>
          </div>

          <div class="lockup" id="r3-lockup">
            <div class="wordrow">
              <div class="pulse-dot" id="r3-dot"></div>
              <div class="word" id="r3-word"
                ><span class="lt">a</span><span class="lt">n</span><span class="lt">v</span><span
                  class="lt"
                  >e</span
                ><span class="lt">i</span><span class="lt">n</span><span class="lt">s</span><span
                  class="lt"
                  >p</span
                ><span class="lt">e</span><span class="lt">c</span><span class="lt">t</span></div
              >
            </div>
            <div class="tagline">
              <span id="r3-typed"></span><span class="caret" id="r3-caret"></span>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
      <script>
        gsap.registerPlugin(TextPlugin);
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* Music grid: 118bpm → beat 0.5085s, bar 2.034s. Reveals land on/near bar lines. */

        /* ── Scene 1 (0.0–1.5s): letters cascade into the lockup ──
           Letter-by-letter staggered assemble; spring-pop settle — the one
           sanctioned overshoot in this video (kept modest, back.out ≤ 1.4). */
        const letters = gsap.utils.toArray("#r3-word .lt");
        letters.forEach((el, i) => {
          tl.fromTo(
            el,
            { y: 66, opacity: 0, scale: 0.9 },
            { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" },
            0.1 + i * 0.05,
          );
        });
        /* Green pulse-dot blooms alive at the wordmark's left on the settle */
        tl.fromTo(
          "#r3-dot",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
          0.92,
        );

        /* ── Scene 2 (1.5–3.0s): tagline types on with caret ── */
        tl.fromTo("#r3-caret", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 1.5);
        tl.to(
          "#r3-typed",
          { text: { value: "every agent. one control plane." }, duration: 1.3, ease: "none" },
          1.53,
        );
        /* caret blinks twice then parks (finite, timeline-driven — no CSS animation) */
        tl.set("#r3-caret", { opacity: 0 }, 2.95);
        tl.set("#r3-caret", { opacity: 1 }, 3.2);
        tl.set("#r3-caret", { opacity: 0 }, 3.45);
        tl.set("#r3-caret", { opacity: 1 }, 3.7);

        /* ── Scene 3 (3.0–5.0s): the REAL dashboard slides up and docks ──
           Lockup + tagline scale down and yield the upper third; the UI card
           rises from below the bottom edge and seats with a gentle 6° tilt. */
        tl.fromTo(
          "#r3-lockup",
          { y: 0, scale: 1 },
          { y: -232, scale: 0.55, duration: 1.15, ease: "power3.inOut" },
          3.05,
        );
        tl.fromTo(
          "#r3-card",
          { y: 900, rotationX: 0 },
          { y: 0, rotationX: 6, duration: 1.35, ease: "power4.out" },
          3.1,
        );

        /* ── Scene 4 (5.0–7.0s): faint accent glow blooms behind the docked UI ──
           ambient-glow-bloom, hero-bloom form: restrained peak, then a bounded
           finite breathe (subtle jitter on the glow ONLY) — no loops, no exits. */
        const glow = document.getElementById("r3-glow");
        tl.fromTo(
          glow,
          { opacity: 0, scale: 0.88 },
          { opacity: 0.22, scale: 1, duration: 1.0, ease: "power2.out" },
          5.09,
        );
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 0.35,
            duration: 0.9,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(phase.p);
              glow.style.opacity = String(0.22 + s * 0.03);
              glow.style.transform = "scale(" + (1 + s * 0.015) + ")";
            },
          },
          6.09,
        );

        window.__timelines["03-reveal"] = tl;
      </script>
    </template>
  </body>
</html>

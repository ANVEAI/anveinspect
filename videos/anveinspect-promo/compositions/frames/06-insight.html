<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>06-insight — the 80% stat</title>
  </head>
  <body>
    <template>
      <style>
        /* Root styled via #root only (never a class on the composition root). */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* Full-bleed ground lives on a clip layer, never on #root. */
        #f06-bg {
          position: absolute;
          inset: 0;
          background: #0a0d12;
        }

        #f06-stage {
          position: absolute;
          inset: 0;
        }

        /* ---- the 80% hero (accent green, value-scaled counter) ---- */
        #f06-numwrap {
          position: absolute;
          left: 0;
          right: 0;
          top: 207px;
          height: 486px;
          display: flex;
          align-items: center;
          justify-content: center;
          will-change: transform, filter, opacity;
        }
        #f06-num {
          display: flex;
          align-items: baseline;
          justify-content: center;
          font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
          font-weight: 900;
          font-size: 300px; /* GSAP tweens this to 540px with the count */
          line-height: 0.9;
          letter-spacing: -0.04em;
          color: #3ecf8e;
          font-variant-numeric: tabular-nums;
        }
        #f06-digits {
          display: inline-block;
          width: 2ch;
          text-align: right;
          font-variant-numeric: tabular-nums;
        }
        #f06-pct {
          display: inline-block;
          will-change: transform, opacity;
        }

        /* ---- support lines (ink white, mono, lowercase) ---- */
        .f06-line {
          position: absolute;
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.32em;
          font-family: ui-monospace, Menlo, Consolas, monospace;
          font-weight: 500;
          font-size: 140px;
          line-height: 1.1;
          color: #eef2f7;
        }
        #f06-l1 {
          top: 533px;
          height: 154px;
        }
        #f06-l2 {
          top: 695px;
          height: 130px;
          /* 27 mono chars must fit 1920px — 140px overflowed the canvas */
          font-size: 104px;
        }
        .f06-line .w {
          display: inline-block;
          will-change: transform, filter, opacity;
        }

        /* ---- quiet dim-mono sub-line ---- */
        #f06-sub {
          position: absolute;
          left: 0;
          right: 0;
          top: 850px;
          height: 34px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: ui-monospace, Menlo, Consolas, monospace;
          font-weight: 500;
          font-size: 27px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #afb7b3;
          will-change: opacity;
        }
      </style>

      <div id="root" data-composition-id="06-insight" data-duration="6.5" data-width="1920" data-height="1080">
        <div id="f06-bg" class="clip" data-start="0" data-duration="6.5" data-track-index="0"></div>

        <div id="f06-stage" class="clip" data-start="0" data-duration="6.5" data-track-index="1">
          <div id="f06-numwrap">
            <div id="f06-num"><span id="f06-digits">0</span><span id="f06-pct">%</span></div>
          </div>

          <div id="f06-l1" class="f06-line">
            <span class="w">of</span><span class="w">your</span><span class="w">agent</span><span class="w">runs</span>
          </div>

          <div id="f06-l2" class="f06-line">
            <span class="w">are</span><span class="w">agents</span><span class="w">spawning</span><span class="w">agents.</span>
          </div>

          <div id="f06-sub">you&rsquo;d never know without the graph.</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* 118bpm grid — beat ≈ 0.5085s, bar ≈ 2.034s. Scene windows are the cues. */
        const BEAT = 60 / 118;

        /* ---------- Scene 1 (0.0–1.5s) — empty for half a beat, then the slam ---------- */
        /* Slam entrance (kinetic-beat-slam: hard attack, fast settle) */
        tl.fromTo(
          "#f06-numwrap",
          { opacity: 0, filter: "blur(18px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" },
          BEAT * 0.5
        );

        /* Value-scaled counter (counting-dynamic-scale): value + font-size in ONE tween,
           compressed into ~0.6s; power3.out — no overshoot on data. */
        const f06Digits = document.getElementById("f06-digits");
        const f06Num = document.getElementById("f06-num");
        const f06State = { v: 0, fs: 300 };
        tl.to(
          f06State,
          {
            v: 80,
            fs: 540,
            duration: 0.6,
            ease: "power3.out",
            onUpdate: () => {
              f06Digits.textContent = Math.round(f06State.v);
              f06Num.style.fontSize = f06State.fs + "px";
            },
          },
          BEAT * 0.5
        );

        /* Suffix lands AFTER the count — its own beat, no overshoot (that's frame 3's move). */
        tl.fromTo(
          "#f06-pct",
          { opacity: 0, y: 60 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
          BEAT * 0.5 + 0.6
        );

        /* ---------- Scene 2 (1.5–3.0s) — the 80% yields ~15% scale; line 1 per-word ---------- */
        tl.to(
          "#f06-numwrap",
          { scale: 0.85, y: -120, duration: 0.7, ease: "power3.out" },
          1.5
        );
        tl.fromTo(
          "#f06-l1 .w",
          { opacity: 0, y: 56, filter: "blur(8px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.45,
            ease: "power4.out",
            stagger: 0.12,
          },
          1.55
        );

        /* ---------- Scene 3 (3.0–4.5s) — line 2 lands, distinct entrance (side snap) ---------- */
        tl.fromTo(
          "#f06-l2 .w",
          { opacity: 0, x: -70 },
          { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.11 },
          3.05
        );

        /* ---------- Scene 4 (4.5–6.0s) — dim sub-line, then held read ---------- */
        tl.fromTo(
          "#f06-sub",
          { opacity: 0 },
          { opacity: 0.85, duration: 0.6, ease: "power2.out" },
          4.55
        );

        /* Subtle jitter only — a barely-visible micro-breath on the number, finite. */
        tl.to(
          "#f06-numwrap",
          { scale: 0.856, duration: 0.33, ease: "sine.inOut", yoyo: true, repeat: 1 },
          5.15
        );

        window.__timelines["06-insight"] = tl;
      </script>
    </template>
  </body>
</html>

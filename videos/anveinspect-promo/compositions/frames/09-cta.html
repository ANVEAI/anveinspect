  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var DUR = 6;
      var T_TYPE_START = 1.0; // Scene 2 window opens
      var T_RETURN = 3.5; // Scene 3: return-flash
      var T_RESP = 3.56; // response prints instantly
      var T_WORDS = 4.5; // Scene 4 window opens
      var T_FADE = 5.55; // held read → black
      var BAR = 2.034; // 118bpm bar — dot pulse period

      /* ---- Scene 1 (0.0–1.0s): card fades up; wordmark + dot already parked ---- */
      tl.fromTo(
        "#cta9-brand",
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#cta9-card",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        0.08
      );

      /* ---- Scene 2 (1.0–3.5s): character-by-character type-on with caret ----
         discrete-text-sequence: threshold states, deterministic per-char jitter
         (no Math.random), pauses on word breaks. */
      var CMD = "npx anveinspect doctor";
      var SEQUENCE = [{ t: 0, text: "" }];
      var acc = T_TYPE_START;
      for (var i = 0; i < CMD.length; i++) {
        var d = 0.07 + 0.04 * (((i * 7) % 5) / 4); // deterministic human jitter
        if (CMD[i] === " ") d += 0.18; // pause at word breaks
        acc += d;
        SEQUENCE.push({ t: acc, text: CMD.slice(0, i + 1) });
      }
      var T_TYPE_END = acc; // ≈ 3.34s — inside the Scene 2 window

      function entryAt(time) {
        for (var j = SEQUENCE.length - 1; j >= 0; j--) {
          if (time >= SEQUENCE[j].t) return SEQUENCE[j];
        }
        return SEQUENCE[0];
      }

      var typedEl = document.getElementById("cta9-typed");
      var caretEl = document.getElementById("cta9-caret");
      var dotEl = document.getElementById("cta9-dot");

      /* single driver: typed text + deterministic caret blink + dot pulse */
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var time = driver.t;
            var entry = entryAt(time);
            typedEl.textContent = entry.text;

            /* caret: solid while typing (grace 0.2s), sin blink when idle,
               hidden after the return-key executes the command */
            var caretOpacity;
            if (time >= T_RETURN) {
              caretOpacity = "0";
            } else if (entry.t > 0 && time - entry.t < 0.2) {
              caretOpacity = "1"; // actively typing — no blink
            } else {
              caretOpacity =
                Math.sin((time * Math.PI * 2) / 0.72) > 0 ? "1" : "0";
            }
            caretEl.style.opacity = caretOpacity;

            /* pulse-dot: slow bounded pulse on the bar grid (sine-wave-loop,
               low amplitude, sin(0)=0 so no jump at t=0) */
            var dotScale = 1 + 0.1 * Math.sin((time * Math.PI * 2) / BAR);
            dotEl.style.transform = "scale(" + dotScale + ")";
          },
        },
        0
      );

      /* ---- Scene 3 (3.5–4.5s): return-flash + instant response print ---- */
      tl.to(
        "#cta9-card",
        { borderColor: "#3ecf8e", duration: 0.08, ease: "power1.out" },
        T_RETURN
      );
      tl.to(
        "#cta9-card",
        {
          borderColor: "rgba(238,242,247,0.14)",
          duration: 0.55,
          ease: "power2.out",
        },
        T_RETURN + 0.16
      );
      tl.fromTo(
        "#cta9-resp",
        { opacity: 0 },
        { opacity: 1, duration: 0.05, ease: "none" },
        T_RESP
      );

      /* ---- Scene 4 (4.5–6.0s): per-word display reveal, then held read ---- */
      tl.fromTo(
        ".cta9-word",
        { opacity: 0, y: 34 },
        {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: "power3.out",
          stagger: 0.13,
        },
        T_WORDS
      );

      /* final settle — quiet fade to black (final frame only) */
      tl.fromTo(
        "#cta9-fade",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.in" },
        T_FADE
      );

      window.__timelines["09-cta"] = tl;
    })();

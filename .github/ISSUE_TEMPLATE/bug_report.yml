name: Bug report
description: Something in AnveInspect isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. AnveInspect is a watchdog — if it crashed, hung,
        or reported a wrong number, that's exactly what we want to know.
        **Do not report security issues here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead?
      placeholder: I ran `anveinspect status` and …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: doctor
    attributes:
      label: "`anveinspect doctor` output"
      description: Paste the platform-check output (redact anything sensitive).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or the commit SHA"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: "macOS 14.5, Node 22.3.0"
    validations:
      required: true
